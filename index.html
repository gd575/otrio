<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>オートリオ AI練習</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4f1ea;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:manipulation}
#app{max-width:720px;margin:auto;padding:12px 12px 24px}
h1{text-align:center;font-size:24px;margin:6px 0 2px}
#sub{text-align:center;color:#666;font-size:12px;margin-bottom:8px}
#status{text-align:center;font-weight:700;min-height:42px;padding:7px}
#boardWrap{display:flex;justify-content:center}
#board{display:grid;grid-template-columns:repeat(3,1fr);width:min(92vw,540px);aspect-ratio:1;border:8px solid #7d5a35;background:#d8b98a;gap:3px;padding:3px;border-radius:8px}
.cell{background:#f8ecd6;border:2px solid #b68b5c;position:relative;display:flex;align-items:center;justify-content:center}
.stack{position:relative;width:86%;height:86%}
.piece{position:absolute;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);border:5px solid currentColor;background:#fffdf8;display:flex;align-items:center;justify-content:center;font-weight:800}
.piece.S{width:34%;height:34%;font-size:11px}.piece.M{width:61%;height:61%;font-size:14px}.piece.L{width:88%;height:88%;font-size:17px}
.red{color:#e53935}.purple{color:#8e44ad}.blue{color:#1e88e5}.green{color:#43a047}
#controls{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}
button,.select{font:inherit;border:1px solid #aaa;border-radius:10px;background:white;padding:9px 13px}
button:disabled{opacity:.4}
#pieces{display:flex;justify-content:center;gap:12px;margin:10px 0}
.pieceBtn{width:78px;height:78px;border:0;background:transparent;position:relative}
.pieceBtn .sample{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);border-radius:50%;border:6px solid currentColor;background:#fffdf8}
.pieceBtn[data-size=S] .sample{width:34px;height:34px}.pieceBtn[data-size=M] .sample{width:52px;height:52px}.pieceBtn[data-size=L] .sample{width:68px;height:68px}
.pieceBtn .label{position:absolute;bottom:0;left:0;right:0;font-size:12px;font-weight:700}.pieceBtn .label.red{color:#e53935}.pieceBtn .label.purple{color:#8e44ad}.pieceBtn .label.blue{color:#1e88e5}.pieceBtn .label.green{color:#43a047}
.pieceBtn.selected{background:#fff;border-radius:12px;outline:3px solid #333}
#info{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-top:8px}
.panel{background:#fffaf1;border-radius:10px;padding:8px;flex:1;text-align:center}
#message{margin-top:10px;text-align:center;color:#555;font-size:12px}#scorePanel{margin-top:8px;background:#fff;border-radius:10px;padding:8px 12px;text-align:center;font-size:13px}#scoreValue{font-size:18px;font-weight:800;margin-top:2px}#scoreExplain{font-size:11px;color:#777;margin-top:2px}
</style>
</head>
<body>
<div id="app">
<h1>オートリオ AI練習</h1>
<div id="sub">駒をタップして選び、置きたいマスをタップしてください</div>
<div id="status"></div>
<div id="boardWrap"><div id="board"></div></div>
<div id="pieces"></div>
<div id="controls">
<label>AIの強さ
<select id="strength" class="select"><option value="2">普通</option><option value="3" selected>強い</option><option value="4">最強</option></select>
</label>
<button id="newGame">新しいゲーム</button>
</div>
<div id="info">
<div class="panel" id="humanInfo"></div>
<div class="panel" id="aiInfo"></div>
</div>
<div id="message"><div>あなた：<span class="red">赤</span> → <span class="purple">紫</span> → <span class="red">赤</span> → <span class="purple">紫</span> …</div><div>AI：<span class="blue">青</span> → <span class="green">緑</span> → <span class="blue">青</span> → <span class="green">緑</span> …</div></div>
</div>
<script>
const SIZES=["S","M","L"], VAL={S:1,M:2,L:3};
const HUMAN=["red","purple"], AI=["blue","green"];
const NAME={red:"赤",purple:"紫",blue:"青",green:"緑"};
const FILL={red:"#e53935",purple:"#8e44ad",blue:"#1e88e5",green:"#43a047"};
const LINES=[
[[0,0],[0,1],[0,2]],[[1,0],[1,1],[1,2]],[[2,0],[2,1],[2,2]],
[[0,0],[1,0],[2,0]],[[0,1],[1,1],[2,1]],[[0,2],[1,2],[2,2]],
[[0,0],[1,1],[2,2]],[[0,2],[1,1],[2,0]]
];
let board,remaining,moveCount,selectedSize=null,selectedColor=null,gameOver=false,aiThinking=false,AI_DEPTH=3;

function reset(){
 board=Array.from({length:3},()=>Array.from({length:3},()=>[]));
 remaining={}; [...HUMAN,...AI].forEach(c=>remaining[c]={S:3,M:3,L:3});
 moveCount=0;selectedSize=null;selectedColor=null;gameOver=false;aiThinking=false;render();
}
function currentPlayer(){return moveCount%2===0?"H":"A"}
function currentColor(){
 const idx=Math.floor(moveCount/2)%2;
 return (currentPlayer()==="H"?HUMAN:AI)[idx];
}
function owner(c){return HUMAN.includes(c)?"H":"A"}
function hasPiece(r,c,color,size=null){return board[r][c].some(p=>p.color===color&&(size===null||p.size===size))}
function canPlace(r,c,color,size){
 if(remaining[color][size]<=0)return false;
 return !board[r][c].some(p=>p.size===size);
}
function doMove(r,c,color,size){board[r][c].push({color,size});remaining[color][size]--}
function undoMove(r,c,color,size){board[r][c].pop();remaining[color][size]++}

function hasOtrio(color){
 for(let r=0;r<3;r++)for(let c=0;c<3;c++){
  const s=new Set(board[r][c].filter(p=>p.color===color).map(p=>p.size));
  if(s.size===3)return true;
 }
 for(const line of LINES){
  const cells=line.map(([r,c])=>board[r][c].filter(p=>p.color===color).map(p=>p.size));
  for(const s of SIZES)if(cells.every(x=>x.includes(s)))return true;
  if(cells[0].includes("S")&&cells[1].includes("M")&&cells[2].includes("L"))return true;
  if(cells[0].includes("L")&&cells[1].includes("M")&&cells[2].includes("S"))return true;
 }
 return false;
}
function winner(){
 for(const c of [...HUMAN,...AI])if(hasOtrio(c))return [owner(c),c];
 return [null,null];
}
function legalMoves(player,ply=moveCount){
 const colors=player==="H"?HUMAN:AI, color=colors[Math.floor(ply/2)%2], out=[];
 for(let r=0;r<3;r++)for(let c=0;c<3;c++)for(const s of SIZES)
  if(canPlace(r,c,color,s))out.push([r,c,color,s]);
 return out;
}
function evaluate(){
 const [wp]=winner(); if(wp==="A")return 100000;if(wp==="H")return -100000;
 let score=0;
 const pos={"1,1":8,"0,0":4,"0,2":4,"2,0":4,"2,2":4};
 for(const k in pos){const [r,c]=k.split(",").map(Number);for(const p of board[r][c])score+=(owner(p.color)==="A"?1:-1)*pos[k]}
 for(const color of [...HUMAN,...AI]){
  const sign=owner(color)==="A"?1:-1;
  for(const line of LINES){
   const cells=line.map(([r,c])=>board[r][c]);
   for(const s of SIZES){
    const n=cells.reduce((a,cell)=>a+(cell.some(p=>p.color===color&&p.size===s)?1:0),0);
    if(n===2)score+=sign*90;else if(n===1)score+=sign*12;
   }
   for(const order of [["S","M","L"],["L","M","S"]]){
    let n=0;for(let i=0;i<3;i++)if(cells[i].some(p=>p.color===color&&p.size===order[i]))n++;
    if(n===2)score+=sign*120;else if(n===1)score+=sign*15;
   }
  }
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){
   const n=SIZES.reduce((a,s)=>a+(hasPiece(r,c,color,s)?1:0),0);
   if(n===2)score+=sign*130;else if(n===1)score+=sign*10;
  }
 }
 return score;
}
function minimax(depth,alpha,beta,maximizing,ply){
 const [wp]=winner();if(wp==="A")return 100000+depth;if(wp==="H")return -100000-depth;
 const moves=legalMoves(maximizing?"A":"H",ply);
 if(!moves.length||depth===0)return evaluate();
 // deterministic ordering is used for a stable iPhone experience
 if(maximizing){
  let v=-Infinity;
  for(const m of moves){doMove(...m);v=Math.max(v,minimax(depth-1,alpha,beta,false,ply+1));undoMove(...m);alpha=Math.max(alpha,v);if(beta<=alpha)break}
  return v;
 }else{
  let v=Infinity;
  for(const m of moves){doMove(...m);v=Math.min(v,minimax(depth-1,alpha,beta,true,ply+1));undoMove(...m);beta=Math.min(beta,v);if(beta<=alpha)break}
  return v;
 }
}
function aiChoose(){
 const moves=legalMoves("A");if(!moves.length)return null;
 for(const m of moves){doMove(...m);const won=hasOtrio(m[2]);undoMove(...m);if(won)return m}
 let best=-Infinity,bestMoves=[];
 for(const m of moves){
  doMove(...m);const v=minimax(AI_DEPTH-1,-Infinity,Infinity,false,moveCount+1);undoMove(...m);
  if(v>best){best=v;bestMoves=[m]}else if(v===best)bestMoves.push(m);
 }
 return bestMoves[Math.floor(Math.random()*bestMoves.length)];
}
function render(){
 const b=document.getElementById("board");b.innerHTML="";
 for(let r=0;r<3;r++)for(let c=0;c<3;c++){
  const cell=document.createElement("div");cell.className="cell";cell.dataset.r=r;cell.dataset.c=c;
  const st=document.createElement("div");st.className="stack";
  [...board[r][c]].sort((a,b)=>VAL[b.size]-VAL[a.size]).forEach(p=>{
   const el=document.createElement("div");el.className=`piece ${p.size} ${p.color}`;el.textContent=p.size;st.appendChild(el);
  });
  cell.appendChild(st);cell.onclick=()=>placeAt(r,c);b.appendChild(cell);
 }
 const pieces=document.getElementById("pieces");pieces.innerHTML="";
 const color=currentPlayer()==="H"?currentColor():HUMAN[0];
 SIZES.forEach(s=>{
  const btn=document.createElement("button");btn.className="pieceBtn"+(selectedSize===s&&selectedColor===color?" selected":"");
  btn.dataset.size=s;btn.disabled=currentPlayer()!=="H"||remaining[color][s]<=0||aiThinking||gameOver;
  btn.innerHTML=`<span class="sample ${color}"></span><span class="label ${color}">${s}　残り ${remaining[color][s]}</span>`;
  btn.onclick=()=>{selectedColor=color;selectedSize=s;render();setStatus(`${NAME[color]}の${s}を選択中。置くマスをタップしてください。`)};
  pieces.appendChild(btn);
 });
 const hc=HUMAN,ac=AI;
 document.getElementById("humanInfo").innerHTML=`あなた：${NAME[hc[0]]} / ${NAME[hc[1]]}<br>S ${remaining[hc[0]].S}/${remaining[hc[1]].S}　M ${remaining[hc[0]].M}/${remaining[hc[1]].M}　L ${remaining[hc[0]].L}/${remaining[hc[1]].L}`;
 document.getElementById("aiInfo").innerHTML=`AI：${NAME[ac[0]]} / ${NAME[ac[1]]}<br>S ${remaining[ac[0]].S}/${remaining[ac[1]].S}　M ${remaining[ac[0]].M}/${remaining[ac[1]].M}　L ${remaining[ac[0]].L}/${remaining[ac[1]].L}`;
  updateScore();
}
function updateScore(){
  const raw=evaluate();
  const aiScore=Math.round(raw);
  const humanScore=-aiScore;
  const hs=humanScore>0?`+${humanScore}`:`${humanScore}`;
  const as=aiScore>0?`+${aiScore}`:`${aiScore}`;
  document.getElementById("scoreValue").textContent=`あなた ${hs}　AI ${as}`;
}
function setStatus(t){document.getElementById("status").textContent=t}
function placeAt(r,c){
 if(gameOver||aiThinking||currentPlayer()!=="H")return;
 if(!selectedSize){setStatus("まずS・M・Lの駒をタップしてください。");return}
 const color=currentColor();
 if(!canPlace(r,c,color,selectedSize)){setStatus("そこには置けません。同じサイズの駒があるか、在庫がありません。");return}
 doMove(r,c,color,selectedSize);moveCount++;selectedSize=null;selectedColor=null;
 const [wp,wc]=winner();
 if(wp){finish(wp,wc);return}
 if(!legalMoves("A")){moveCount++;if(!legalMoves("H")){finishDraw();return}setStatus(`AIはパス。あなたの番：${NAME[currentColor()]}の駒`);render();return}
 aiThinking=true;setStatus("AIが考えています…");render();
 setTimeout(aiTurn,60);
}
function aiTurn(){
 if(gameOver||currentPlayer()!=="A")return;
 const m=aiChoose();
 if(!m){moveCount++;if(!legalMoves("H")){finishDraw();return}aiThinking=false;setStatus(`AIはパス。あなたの番：${NAME[currentColor()]}の駒`);render();return}
 doMove(...m);moveCount++;
 const [wp,wc]=winner();if(wp){finish(wp,wc);return}
 if(!legalMoves("H")){moveCount++;if(!legalMoves("A")){finishDraw();return}aiThinking=true;setStatus("あなたはパス。AIが考えています…");render();setTimeout(aiTurn,60);return}
 aiThinking=false;setStatus(`あなたの番：${NAME[currentColor()]}の駒を選んでください`);render();
}
function finish(wp,wc){
 gameOver=true;aiThinking=false;render();
 setStatus(wp==="H"?`あなたの勝ち！ ${NAME[wc]}のOtrio！`:`AIの勝ち。 ${NAME[wc]}のOtrio！`);
 setTimeout(()=>alert(wp==="H"?`あなたの勝ち！\n${NAME[wc]}のOtrio！`:`AIの勝ち。\n${NAME[wc]}のOtrio！`),50);
}
function finishDraw(){gameOver=true;aiThinking=false;render();setStatus("引き分けです");alert("引き分けです");}
document.getElementById("newGame").onclick=reset;
document.getElementById("strength").onchange=e=>{AI_DEPTH=Number(e.target.value);setStatus(`AIの強さを「${e.target.selectedOptions[0].text}」にしました`)};
reset();
</script>
</body>
</html>
