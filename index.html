<script>

/* =========================================================
   基本設定
========================================================= */

const SIZES = ["S", "M", "L"];

const HUMAN_COLORS = ["red", "purple"];

const AI_COLORS = ["blue", "green"];

const ALL_COLORS = [
    ...HUMAN_COLORS,
    ...AI_COLORS
];

const COLOR_NAMES = {

    red: "赤",

    purple: "紫",

    blue: "青",

    green: "緑"

};


/*
   ★ 色コードはここだけで管理する
*/

const COLOR_CODES = {

    red: "#e53935",

    purple: "#8e44ad",

    blue: "#1e88e5",

    green: "#43a047"

};


/* =========================================================
   勝利ライン
========================================================= */

const LINES = [

    [[0,0],[0,1],[0,2]],

    [[1,0],[1,1],[1,2]],

    [[2,0],[2,1],[2,2]],

    [[0,0],[1,0],[2,0]],

    [[0,1],[1,1],[2,1]],

    [[0,2],[1,2],[2,2]],

    [[0,0],[1,1],[2,2]],

    [[0,2],[1,1],[2,0]]

];


/* =========================================================
   ゲーム状態
========================================================= */

let board;

let remaining;

let humanMoveCount;

let aiMoveCount;

let turnPlayer;

let selectedSize;

let gameOver;

let aiThinking;


/* =========================================================
   HTML
========================================================= */

const boardElement =
    document.getElementById("board");

const paletteElement =
    document.getElementById("palette");

const paletteTitle =
    document.getElementById("palette-title");

const statusElement =
    document.getElementById("status");

const turnInfo =
    document.getElementById("turn-info");

const orderInfo =
    document.getElementById("order-info");

const strengthElement =
    document.getElementById("strength");


/* =========================================================
   ★★★ 色を取得する唯一のゲーム関数 ★★★
========================================================= */

function getCurrentColor(player) {

    if (player === "H") {

        return HUMAN_COLORS[
            humanMoveCount % 2
        ];

    }

    return AI_COLORS[
        aiMoveCount % 2
    ];

}


/* =========================================================
   色コード
========================================================= */

function getColorCode(color) {

    return COLOR_CODES[color];

}


/* =========================================================
   プレイヤー判定
========================================================= */

function playerOfColor(color) {

    if (
        HUMAN_COLORS.includes(color)
    ) {

        return "H";

    }

    return "A";

}


/* =========================================================
   新しいゲーム
========================================================= */

function newGame() {

    board =
        Array.from(
            { length: 3 },
            () =>
                Array.from(
                    { length: 3 },
                    () => []
                )
        );


    remaining = {};


    for (
        const color of ALL_COLORS
    ) {

        remaining[color] = {

            S: 3,

            M: 3,

            L: 3

        };

    }


    humanMoveCount = 0;

    aiMoveCount = 0;

    turnPlayer = "H";

    selectedSize = null;

    gameOver = false;

    aiThinking = false;


    statusElement.textContent =
        "ゲーム開始。赤の駒を選んでください。";


    render();

}


/* =========================================================
   サイズ数値
========================================================= */

function sizeValue(size) {

    return {

        S: 1,

        M: 2,

        L: 3

    }[size];

}


/* =========================================================
   駒を置けるか
========================================================= */

function canPlace(
    r,
    c,
    color,
    size
) {

    if (
        remaining[color][size] <= 0
    ) {

        return false;

    }


    /*
       Otrioでは同じマスに
       同じサイズを置けない
    */

    for (
        const piece of board[r][c]
    ) {

        if (
            piece.size === size
        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   駒を置く
========================================================= */

function doMove(
    r,
    c,
    color,
    size
) {

    board[r][c].push({

        color: color,

        size: size

    });

    remaining[color][size]--;

}


/* =========================================================
   駒を戻す
========================================================= */

function undoMove(
    r,
    c,
    color,
    size
) {

    const cell =
        board[r][c];

    const index =
        cell.findIndex(
            piece =>
                piece.color === color &&
                piece.size === size
        );

    if (index !== -1) {

        cell.splice(index, 1);

        remaining[color][size]++;

    }

}


/* =========================================================
   駒の存在確認
========================================================= */

function hasPiece(
    r,
    c,
    color,
    size
) {

    return board[r][c].some(

        piece =>

            piece.color === color &&

            piece.size === size

    );

}


/* =========================================================
   同一マスSML
========================================================= */

function hasSameCellOtrio(color) {

    for (let r = 0; r < 3; r++) {

        for (let c = 0; c < 3; c++) {

            const sizes =
                new Set();

            for (
                const piece of board[r][c]
            ) {

                if (
                    piece.color === color
                ) {

                    sizes.add(
                        piece.size
                    );

                }

            }

            if (

                sizes.has("S") &&

                sizes.has("M") &&

                sizes.has("L")

            ) {

                return true;

            }

        }

    }

    return false;

}


/* =========================================================
   ラインOtrio
========================================================= */

function hasLineOtrio(color) {

    for (
        const line of LINES
    ) {

        /*
           同じサイズ3個
        */

        for (
            const size of SIZES
        ) {

            if (
                line.every(
                    ([r,c]) =>
                        hasPiece(
                            r,
                            c,
                            color,
                            size
                        )
                )
            ) {

                return true;

            }

        }


        /*
           S-M-L
        */

        if (

            hasPiece(
                line[0][0],
                line[0][1],
                color,
                "S"
            )

            &&

            hasPiece(
                line[1][0],
                line[1][1],
                color,
                "M"
            )

            &&

            hasPiece(
                line[2][0],
                line[2][1],
                color,
                "L"
            )

        ) {

            return true;

        }


        /*
           L-M-S
        */

        if (

            hasPiece(
                line[0][0],
                line[0][1],
                color,
                "L"
            )

            &&

            hasPiece(
                line[1][0],
                line[1][1],
                color,
                "M"
            )

            &&

            hasPiece(
                line[2][0],
                line[2][1],
                color,
                "S"
            )

        ) {

            return true;

        }

    }

    return false;

}


/* =========================================================
   Otrio判定
========================================================= */

function hasOtrio(color) {

    return (

        hasSameCellOtrio(color)

        ||

        hasLineOtrio(color)

    );

}


/* =========================================================
   勝者
========================================================= */

function getWinner() {

    for (
        const color of ALL_COLORS
    ) {

        if (
            hasOtrio(color)
        ) {

            return {

                player:
                    playerOfColor(color),

                color: color

            };

        }

    }

    return null;

}


/* =========================================================
   合法手
========================================================= */

function legalMoves(player) {

    const color =
        getCurrentColor(player);

    const moves = [];


    for (let r = 0; r < 3; r++) {

        for (let c = 0; c < 3; c++) {

            for (
                const size of SIZES
            ) {

                if (
                    canPlace(
                        r,
                        c,
                        color,
                        size
                    )
                ) {

                    moves.push({

                        r: r,

                        c: c,

                        color: color,

                        size: size

                    });

                }

            }

        }

    }


    return moves;

}


/* =========================================================
   評価関数
========================================================= */

function evaluate() {

    const win =
        getWinner();

    if (win) {

        return win.player === "A"
            ? 100000
            : -100000;

    }


    let score = 0;


    /*
       中央・角を評価
    */

    const positionValue = {

        "1,1": 8,

        "0,0": 4,

        "0,2": 4,

        "2,0": 4,

        "2,2": 4

    };


    for (
        const key in positionValue
    ) {

        const [r,c] =
            key
                .split(",")
                .map(Number);

        for (
            const piece of board[r][c]
        ) {

            const sign =
                playerOfColor(
                    piece.color
                ) === "A"
                    ? 1
                    : -1;

            score +=
                sign *
                positionValue[key];

        }

    }


    /*
       ライン評価
    */

    for (
        const color of ALL_COLORS
    ) {

        const sign =
            playerOfColor(color) === "A"
                ? 1
                : -1;


        for (
            const line of LINES
        ) {

            /*
               同じサイズ
            */

            for (
                const size of SIZES
            ) {

                let count = 0;

                for (
                    const [r,c] of line
                ) {

                    if (
                        hasPiece(
                            r,
                            c,
                            color,
                            size
                        )
                    ) {

                        count++;

                    }

                }


                if (count === 2) {

                    score +=
                        sign * 80;

                }

                else if (count === 1) {

                    score +=
                        sign * 10;

                }

            }


            /*
               S-M-L / L-M-S
            */

            for (
                const order of [
                    ["S","M","L"],
                    ["L","M","S"]
                ]
            ) {

                let count = 0;

                for (
                    let i = 0;
                    i < 3;
                    i++
                ) {

                    const [r,c] =
                        line[i];

                    if (
                        hasPiece(
                            r,
                            c,
                            color,
                            order[i]
                        )
                    ) {

                        count++;

                    }

                }


                if (count === 2) {

                    score +=
                        sign * 110;

                }

                else if (count === 1) {

                    score +=
                        sign * 12;

                }

            }

        }


        /*
           同一マス
        */

        for (let r = 0; r < 3; r++) {

            for (let c = 0; c < 3; c++) {

                let count = 0;

                for (
                    const size of SIZES
                ) {

                    if (
                        hasPiece(
                            r,
                            c,
                            color,
                            size
                        )
                    ) {

                        count++;

                    }

                }


                if (count === 2) {

                    score +=
                        sign * 120;

                }

                else if (count === 1) {

                    score +=
                        sign * 10;

                }

            }

        }

    }


    return score;

}


/* =========================================================
   Minimax
========================================================= */

function minimax(
    depth,
    alpha,
    beta,
    maximizing,
    hCount,
    aCount
) {

    const winner =
        getWinner();

    if (winner) {

        if (
            winner.player === "A"
        ) {

            return 100000 + depth;

        }

        return -100000 - depth;

    }


    if (depth <= 0) {

        return evaluate();

    }


    const player =
        maximizing
            ? "A"
            : "H";


    /*
       シミュレーション用の
       色カウントを保存
    */

    const oldH =
        humanMoveCount;

    const oldA =
        aiMoveCount;


    humanMoveCount =
        hCount;

    aiMoveCount =
        aCount;


    const moves =
        legalMoves(player);


    humanMoveCount =
        oldH;

    aiMoveCount =
        oldA;


    if (
        moves.length === 0
    ) {

        /*
           パス
        */

        return minimax(

            depth - 1,

            alpha,

            beta,

            !maximizing,

            player === "H"
                ? hCount
                : hCount,

            player === "A"
                ? aCount
                : aCount

        );

    }


    if (maximizing) {

        let value =
            -Infinity;


        for (
            const move of moves
        ) {

            doMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            value =
                Math.max(

                    value,

                    minimax(

                        depth - 1,

                        alpha,

                        beta,

                        false,

                        player === "H"
                            ? hCount + 1
                            : hCount,

                        player === "A"
                            ? aCount + 1
                            : aCount

                    )

                );


            undoMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            alpha =
                Math.max(
                    alpha,
                    value
                );


            if (
                beta <= alpha
            ) {

                break;

            }

        }


        return value;

    }


    else {

        let value =
            Infinity;


        for (
            const move of moves
        ) {

            doMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            value =
                Math.min(

                    value,

                    minimax(

                        depth - 1,

                        alpha,

                        beta,

                        true,

                        player === "H"
                            ? hCount + 1
                            : hCount,

                        player === "A"
                            ? aCount + 1
                            : aCount

                    )

                );


            undoMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            beta =
                Math.min(
                    beta,
                    value
                );


            if (
                beta <= alpha
            ) {

                break;

            }

        }


        return value;

    }

}


/* =========================================================
   AIの手を選ぶ
========================================================= */

function aiChooseMove() {

    const moves =
        legalMoves("A");


    if (
        moves.length === 0
    ) {

        return null;

    }


    /*
       ① 今すぐ勝てる手
    */

    for (
        const move of moves
    ) {

        doMove(
            move.r,
            move.c,
            move.color,
            move.size
        );


        const won =
            hasOtrio(
                move.color
            );


        undoMove(
            move.r,
            move.c,
            move.color,
            move.size
        );


        if (won) {

            return move;

        }

    }


    /*
       ② 人間が次に勝つ場合を防ぐ
    */

    const humanMoves =
        legalMoves("H");


    for (
        const humanMove of humanMoves
    ) {

        doMove(
            humanMove.r,
            humanMove.c,
            humanMove.color,
            humanMove.size
        );


        const humanWins =
            hasOtrio(
                humanMove.color
            );


        undoMove(
            humanMove.r,
            humanMove.c,
            humanMove.color,
            humanMove.size
        );


        if (
            humanWins
        ) {

            /*
               この手を防ぐAI手を探す
            */

            const blockingMoves =
                moves.filter(
                    move =>
                        move.r === humanMove.r &&
                        move.c === humanMove.c
                );


            if (
                blockingMoves.length > 0
            ) {

                return blockingMoves[
                    Math.floor(
                        Math.random() *
                        blockingMoves.length
                    )
                ];

            }

        }

    }


    /*
       ③ Minimax
    */

    const depth =
        Number(
            strengthElement.value
        );


    let bestValue =
        -Infinity;

    let bestMoves = [];


    /*
       探索順をランダム化
    */

    shuffle(moves);


    for (
        const move of moves
    ) {

        doMove(
            move.r,
            move.c,
            move.color,
            move.size
        );


        const value =
            minimax(

                depth - 1,

                -Infinity,

                Infinity,

                false,

                humanMoveCount,

                aiMoveCount + 1

            );


        undoMove(
            move.r,
            move.c,
            move.color,
            move.size
        );


        if (
            value > bestValue
        ) {

            bestValue =
                value;

            bestMoves =
                [move];

        }

        else if (
            value === bestValue
        ) {

            bestMoves.push(
                move
            );

        }

    }


    return bestMoves[
        Math.floor(
            Math.random() *
            bestMoves.length
        )
    ];

}


/* =========================================================
   シャッフル
========================================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];

    }

}


/* =========================================================
   色順表示
========================================================= */

function updateOrderDisplay() {

    const humanIndex =
        humanMoveCount % 4;

    const aiIndex =
        aiMoveCount % 4;


    const humanOrder = [
        "red",
        "purple",
        "red",
        "purple"
    ];


    const aiOrder = [
        "blue",
        "green",
        "blue",
        "green"
    ];


    let html =
        "あなた：";


    for (
        let i = 0;
        i < humanOrder.length;
        i++
    ) {

        const color =
            humanOrder[i];


        if (
            i === humanIndex &&
            !gameOver
        ) {

            html +=
                `<span style="color:${getColorCode(color)}">${COLOR_NAMES[color]}</span>`;

        }

        else {

            html +=
                COLOR_NAMES[color];

        }


        if (i < 3) {

            html +=
                " → ";

        }

    }


    html +=
        "　・　AI：";


    for (
        let i = 0;
        i < aiOrder.length;
        i++
    ) {

        const color =
            aiOrder[i];


        if (
            i === aiIndex &&
            !gameOver
        ) {

            html +=
                `<span style="color:${getColorCode(color)}">${COLOR_NAMES[color]}</span>`;

        }

        else {

            html +=
                COLOR_NAMES[color];

        }


        if (i < 3) {

            html +=
                " → ";

        }

    }


    orderInfo.innerHTML =
        html;

}


/* =========================================================
   ターン表示
========================================================= */

function updateTurnDisplay() {

    if (gameOver) {

        return;

    }


    const color =
        getCurrentColor(
            turnPlayer
        );


    if (
        turnPlayer === "H"
    ) {

        turnInfo.textContent =
            `あなたの番：${COLOR_NAMES[color]}`;


        turnInfo.style.color =
            getColorCode(color);


        paletteTitle.textContent =
            `${COLOR_NAMES[color]}の駒を選んでください`;

    }

    else {

        turnInfo.textContent =
            `AIの番：${COLOR_NAMES[color]}`;


        turnInfo.style.color =
            getColorCode(color);


        paletteTitle.textContent =
            "AIが考えています…";

    }


    updateOrderDisplay();

}


/* =========================================================
   盤面描画
========================================================= */

function renderBoard() {

    boardElement.innerHTML = "";


    for (let r = 0; r < 3; r++) {

        for (let c = 0; c < 3; c++) {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "cell";


            cell.addEventListener(
                "click",
                () =>
                    placeSelected(r,c)
            );


            /*
               大きい順に描画
            */

            const pieces =
                [...board[r][c]]
                    .sort(
                        (a,b) =>
                            sizeValue(b.size) -
                            sizeValue(a.size)
                    );


            for (
                const piece of pieces
            ) {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    `piece ${piece.size}`;


                /*
                   ★★★★★
                   ここが重要
                   色をJavaScriptで直接指定
                   ★★★★★
                */

                element.style.borderColor =
                    getColorCode(
                        piece.color
                    );


                /*
                   念のため色をdata属性にも保存
                */

                element.dataset.color =
                    piece.color;


                cell.appendChild(
                    element
                );

            }


            boardElement.appendChild(
                cell
            );

        }

    }

}


/* =========================================================
   手元描画
========================================================= */

function renderPalette() {

    paletteElement.innerHTML = "";


    if (
        turnPlayer !== "H" ||
        gameOver
    ) {

        return;

    }


    const color =
        getCurrentColor("H");


    for (
        const size of SIZES
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            `piece-button ${size}`;


        if (
            remaining[color][size] <= 0
        ) {

            button.classList.add(
                "disabled"
            );

        }


        if (
            selectedSize === size
        ) {

            button.classList.add(
                "selected"
            );

        }


        const ring =
            document.createElement(
                "div"
            );


        ring.className =
            "ring";


        /*
           ★ 手元も直接色指定
        */

        ring.style.borderColor =
            getColorCode(color);


        const text =
            document.createElement(
                "div"
            );


        text.textContent =
            `${size}　残り ${remaining[color][size]}`;


        button.appendChild(
            ring
        );

        button.appendChild(
            text
        );


        button.addEventListener(
            "click",
            () => {

                if (
                    remaining[color][size] <= 0
                ) {

                    return;

                }


                selectedSize =
                    selectedSize === size
                        ? null
                        : size;


                if (
                    selectedSize
                ) {

                    statusElement.textContent =
                        `${COLOR_NAMES[color]}の${size}を選択中。盤のマスをタップしてください。`;

                }

                else {

                    statusElement.textContent =
                        "駒の選択を解除しました。";

                }


                renderPalette();

            }
        );


        paletteElement.appendChild(
            button
        );

    }

}


/* =========================================================
   全体描画
========================================================= */

function render() {

    renderBoard();

    renderPalette();

    updateTurnDisplay();

}


/* =========================================================
   次のターンへ
========================================================= */

function switchTurn() {

    turnPlayer =
        turnPlayer === "H"
            ? "A"
            : "H";

}


/* =========================================================
   ゲーム終了
========================================================= */

function finishGame(win) {

    gameOver = true;

    aiThinking = false;


    render();


    if (
        win.player === "H"
    ) {

        turnInfo.textContent =
            `${COLOR_NAMES[win.color]}のOtrio！`;

        turnInfo.style.color =
            getColorCode(
                win.color
            );


        statusElement.textContent =
            "あなたの勝ちです！";


        setTimeout(
            () => {

                alert(
                    `Otrio！\n${COLOR_NAMES[win.color]}の勝ちです！`
                );

            },
            50
        );

    }

    else {

        turnInfo.textContent =
            `${COLOR_NAMES[win.color]}のOtrio！`;

        turnInfo.style.color =
            getColorCode(
                win.color
            );


        statusElement.textContent =
            "AIの勝ちです。";


        setTimeout(
            () => {

                alert(
                    `Otrio！\nAIの勝ちです！`
                );

            },
            50
        );

    }

}


/* =========================================================
   引き分け判定
========================================================= */

function checkDraw() {

    const human =
        legalMoves("H");

    const ai =
        legalMoves("A");


    if (
        human.length === 0 &&
        ai.length === 0
    ) {

        gameOver = true;


        render();


        statusElement.textContent =
            "どちらも置ける駒がないため引き分けです。";


        setTimeout(
            () =>
                alert(
                    "引き分けです。"
                ),
            50
        );


        return true;

    }


    return false;

}


/* =========================================================
   人間の手
========================================================= */

function placeSelected(r,c) {

    if (
        gameOver
    ) {

        return;

    }


    if (
        turnPlayer !== "H"
    ) {

        return;

    }


    if (
        selectedSize === null
    ) {

        statusElement.textContent =
            "まずS・M・Lの駒を選んでください。";

        return;

    }


    const color =
        getCurrentColor("H");


    if (
        !canPlace(
            r,
            c,
            color,
            selectedSize
        )
    ) {

        statusElement.textContent =
            "そこには置けません。同じサイズの駒がある可能性があります。";

        return;

    }


    const size =
        selectedSize;


    /*
       駒を置く
    */

    doMove(
        r,
        c,
        color,
        size
    );


    /*
       ★ あなたの着手回数だけ増やす
    */

    humanMoveCount++;


    selectedSize = null;


    /*
       勝敗判定
    */

    const win =
        getWinner();


    if (win) {

        finishGame(win);

        return;

    }


    /*
       次はAI
    */

    switchTurn();


    /*
       AIに合法手があるか
    */

    if (
        legalMoves("A").length === 0
    ) {

        /*
           AIパス
        */

        statusElement.textContent =
            `AIは${COLOR_NAMES[getCurrentColor("A")]}を置けないためパスします。`;


        switchTurn();


        /*
           あなたも置けない場合
        */

        if (
            legalMoves("H").length === 0
        ) {

            checkDraw();

            return;

        }


        render();


        return;

    }


    statusElement.textContent =
        `AIの番：${COLOR_NAMES[getCurrentColor("A")]}。考えています…`;


    render();


    /*
       少し待ってからAI
    */

    aiThinking = true;


    setTimeout(
        aiTurn,
        150
    );

}


/* =========================================================
   AIターン
========================================================= */

function aiTurn() {

    if (
        gameOver
    ) {

        return;

    }


    if (
        turnPlayer !== "A"
    ) {

        return;

    }


    const aiColor =
        getCurrentColor("A");


    statusElement.textContent =
        `AIの番：${COLOR_NAMES[aiColor]}。考えています…`;


    render();


    setTimeout(
        () => {

            if (gameOver) {

                return;

            }


            const move =
                aiChooseMove();


            /*
               AIが置けない
            */

            if (
                !move
            ) {

                aiThinking = false;


                statusElement.textContent =
                    `AIは${COLOR_NAMES[aiColor]}を置けないためパスします。`;


                switchTurn();


                /*
                   あなたも置けない
                */

                if (
                    legalMoves("H").length === 0
                ) {

                    checkDraw();

                    return;

                }


                render();

                return;

            }


            /*
               AIが実際に置く
            */

            doMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            /*
               ★ AIの着手回数だけ増やす
            */

            aiMoveCount++;


            aiThinking = false;


            /*
               勝敗
            */

            const win =
                getWinner();


            if (win) {

                finishGame(win);

                return;

            }


            /*
               次はあなた
            */

            switchTurn();


            /*
               あなたが置けるか
            */

            if (
                legalMoves("H").length === 0
            ) {

                const skippedColor =
                    getCurrentColor("H");


                statusElement.textContent =
                    `あなたは${COLOR_NAMES[skippedColor]}を置けないためパスします。`;


                switchTurn();


                /*
                   AIも置けない
                */

                if (
                    legalMoves("A").length === 0
                ) {

                    checkDraw();

                    return;

                }


                render();


                setTimeout(
                    aiTurn,
                    300
                );


                return;

            }


            statusElement.textContent =
                `あなたの番：${COLOR_NAMES[getCurrentColor("H")]}の駒を選んでください`;


            render();

        },
        100
    );

}


/* =========================================================
   新しいゲームボタン
========================================================= */

document
    .getElementById("new-game")
    .addEventListener(
        "click",
        newGame
    );


/* =========================================================
   起動
========================================================= */

newGame();

</script>
