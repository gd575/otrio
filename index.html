<script>

/* =========================================================
   基本設定
========================================================= */

const SIZES = ["S", "M", "L"];

const HUMAN_COLORS = ["red", "purple"];

const AI_COLORS = ["blue", "green"];

const COLOR_NAMES = {

    red: "赤",

    purple: "紫",

    blue: "青",

    green: "緑"
};


/* 勝利ライン */

const LINES = [

    [[0,0],[0,1],[0,2]],

    [[1,0],[1,1],[1,2]],

    [[2,0],[2,1],[2,2]],

    [[0,0],[1,0],[2,0]],

    [[0,1],[1,1],[2,1]],

    [[0,2],[1,2],[2,2]],

    [[0,0],[1,1],[2,2]],

    [[0,2],[1,1],[2,0]]

];


/* =========================================================
   ゲーム状態
========================================================= */

let board;

let remaining;

let moveCount;

let selectedSize = null;

let gameOver = false;

/*
   最新の1手
   例：
   {
       r: 1,
       c: 1,
       color: "red",
       size: "M"
   }
*/
let lastMove = null;


/* =========================================================
   HTML
========================================================= */

const boardElement =
    document.getElementById("board");

const paletteElement =
    document.getElementById("palette");

const paletteTitle =
    document.getElementById("palette-title");

const statusElement =
    document.getElementById("status");

const turnInfo =
    document.getElementById("turn-info");

const strengthElement =
    document.getElementById("strength");


/* =========================================================
   新しいゲーム
========================================================= */

function newGame() {

    board =
        Array.from(
            {length: 3},
            () =>
                Array.from(
                    {length: 3},
                    () => []
                )
        );

    remaining = {};

    for (
        const color
        of [...HUMAN_COLORS, ...AI_COLORS]
    ) {

        remaining[color] = {

            S: 3,

            M: 3,

            L: 3
        };
    }

    moveCount = 0;

    selectedSize = null;

    gameOver = false;

    lastMove = null;

    statusElement.textContent =
        "あなたの番です。";

    updateTurnDisplay();

    render();
}


/* =========================================================
   現在のプレイヤー
========================================================= */

function currentPlayer() {

    return moveCount % 2 === 0
        ? "H"
        : "A";
}


/* =========================================================
   現在の色
========================================================= */

function currentColor() {

    const index =
        Math.floor(moveCount / 2) % 2;

    if (
        currentPlayer() === "H"
    ) {

        return HUMAN_COLORS[index];

    } else {

        return AI_COLORS[index];
    }
}


/* =========================================================
   色からプレイヤー
========================================================= */

function playerOfColor(color) {

    return HUMAN_COLORS.includes(color)
        ? "H"
        : "A";
}


/* =========================================================
   駒を置けるか
========================================================= */

function canPlace(
    r,
    c,
    color,
    size
) {

    if (
        remaining[color][size] <= 0
    ) {

        return false;
    }

    for (
        const piece
        of board[r][c]
    ) {

        if (
            piece.size === size
        ) {

            return false;
        }
    }

    return true;
}


/* =========================================================
   駒を置く
========================================================= */

function doMove(
    r,
    c,
    color,
    size
) {

    board[r][c].push({

        color: color,

        size: size
    });

    remaining[color][size]--;
}


/* =========================================================
   駒を戻す
========================================================= */

function undoMove(
    r,
    c,
    color,
    size
) {

    board[r][c].pop();

    remaining[color][size]++;
}


/* =========================================================
   駒の存在確認
========================================================= */

function hasPiece(
    r,
    c,
    color,
    size
) {

    return board[r][c].some(

        piece =>

            piece.color === color &&

            (
                size === undefined ||
                piece.size === size
            )
    );
}


/* =========================================================
   Otrio判定
========================================================= */

function hasOtrio(color) {

    /* 同じマスにS/M/L */

    for (
        let r = 0;
        r < 3;
        r++
    ) {

        for (
            let c = 0;
            c < 3;
            c++
        ) {

            const sizes =
                new Set();

            for (
                const piece
                of board[r][c]
            ) {

                if (
                    piece.color === color
                ) {

                    sizes.add(
                        piece.size
                    );
                }
            }

            if (
                sizes.has("S") &&
                sizes.has("M") &&
                sizes.has("L")
            ) {

                return true;
            }
        }
    }


    /* 3マスのライン */

    for (
        const line
        of LINES
    ) {

        /* 同じサイズ3個 */

        for (
            const size
            of SIZES
        ) {

            if (
                line.every(
                    ([r,c]) =>
                        hasPiece(
                            r,
                            c,
                            color,
                            size
                        )
                )
            ) {

                return true;
            }
        }


        /* S-M-L */

        if (

            hasPiece(
                line[0][0],
                line[0][1],
                color,
                "S"
            )

            &&

            hasPiece(
                line[1][0],
                line[1][1],
                color,
                "M"
            )

            &&

            hasPiece(
                line[2][0],
                line[2][1],
                color,
                "L"
            )

        ) {

            return true;
        }


        /* L-M-S */

        if (

            hasPiece(
                line[0][0],
                line[0][1],
                color,
                "L"
            )

            &&

            hasPiece(
                line[1][0],
                line[1][1],
                color,
                "M"
            )

            &&

            hasPiece(
                line[2][0],
                line[2][1],
                color,
                "S"
            )

        ) {

            return true;
        }
    }

    return false;
}


/* =========================================================
   勝者
========================================================= */

function winner() {

    for (
        const color
        of [...HUMAN_COLORS, ...AI_COLORS]
    ) {

        if (
            hasOtrio(color)
        ) {

            return {

                player:
                    playerOfColor(color),

                color:
                    color
            };
        }
    }

    return null;
}


/* =========================================================
   合法手
========================================================= */

function legalMoves(
    player,
    ply = moveCount
) {

    const colors =
        player === "H"
            ? HUMAN_COLORS
            : AI_COLORS;

    const index =
        Math.floor(ply / 2) % 2;

    const color =
        colors[index];

    const moves = [];

    for (
        let r = 0;
        r < 3;
        r++
    ) {

        for (
            let c = 0;
            c < 3;
            c++
        ) {

            for (
                const size
                of SIZES
            ) {

                if (
                    canPlace(
                        r,
                        c,
                        color,
                        size
                    )
                ) {

                    moves.push({

                        r: r,

                        c: c,

                        color: color,

                        size: size
                    });
                }
            }
        }
    }

    return moves;
}


/* =========================================================
   評価関数
========================================================= */

function evaluate() {

    const win = winner();

    if (win) {

        return win.player === "A"
            ? 100000
            : -100000;
    }

    let score = 0;


    const positions = {

        "1,1": 8,

        "0,0": 4,

        "0,2": 4,

        "2,0": 4,

        "2,2": 4
    };


    for (
        const key
        in positions
    ) {

        const [r,c] =
            key
            .split(",")
            .map(Number);

        for (
            const piece
            of board[r][c]
        ) {

            const value =
                positions[key];

            score +=

                playerOfColor(
                    piece.color
                ) === "A"

                    ? value
                    : -value;
        }
    }


    for (
        const color
        of [...HUMAN_COLORS, ...AI_COLORS]
    ) {

        const sign =

            playerOfColor(color) === "A"
                ? 1
                : -1;


        for (
            const line
            of LINES
        ) {

            for (
                const size
                of SIZES
            ) {

                const count =

                    line.filter(

                        ([r,c]) =>

                            hasPiece(
                                r,
                                c,
                                color,
                                size
                            )

                    ).length;


                if (
                    count === 2
                ) {

                    score +=
                        sign * 90;
                }

                if (
                    count === 1
                ) {

                    score +=
                        sign * 12;
                }
            }


            for (
                const order
                of [
                    ["S","M","L"],
                    ["L","M","S"]
                ]
            ) {

                let count = 0;

                for (
                    let i = 0;
                    i < 3;
                    i++
                ) {

                    const [r,c] =
                        line[i];

                    if (
                        hasPiece(
                            r,
                            c,
                            color,
                            order[i]
                        )
                    ) {

                        count++;
                    }
                }


                if (
                    count === 2
                ) {

                    score +=
                        sign * 120;
                }

                if (
                    count === 1
                ) {

                    score +=
                        sign * 15;
                }
            }
        }


        /* 同じマスに2サイズ */

        for (
            let r = 0;
            r < 3;
            r++
        ) {

            for (
                let c = 0;
                c < 3;
                c++
            ) {

                let count = 0;

                for (
                    const size
                    of SIZES
                ) {

                    if (
                        hasPiece(
                            r,
                            c,
                            color,
                            size
                        )
                    ) {

                        count++;
                    }
                }


                if (
                    count === 2
                ) {

                    score +=
                        sign * 130;
                }

                if (
                    count === 1
                ) {

                    score +=
                        sign * 10;
                }
            }
        }
    }

    return score;
}


/* =========================================================
   Minimax
========================================================= */

function minimax(
    depth,
    alpha,
    beta,
    maximizing,
    ply
) {

    const win = winner();

    if (win) {

        return win.player === "A"

            ? 100000 + depth

            : -100000 - depth;
    }


    if (
        depth <= 0
    ) {

        return evaluate();
    }


    const player =
        maximizing
            ? "A"
            : "H";


    const moves =
        legalMoves(
            player,
            ply
        );


    if (
        moves.length === 0
    ) {

        return evaluate();
    }


    shuffle(moves);


    if (maximizing) {

        let value =
            -Infinity;


        for (
            const move
            of moves
        ) {

            doMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            value = Math.max(

                value,

                minimax(

                    depth - 1,

                    alpha,

                    beta,

                    false,

                    ply + 1
                )
            );


            undoMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            alpha =
                Math.max(
                    alpha,
                    value
                );


            if (
                beta <= alpha
            ) {

                break;
            }
        }


        return value;

    } else {

        let value =
            Infinity;


        for (
            const move
            of moves
        ) {

            doMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            value = Math.min(

                value,

                minimax(

                    depth - 1,

                    alpha,

                    beta,

                    true,

                    ply + 1
                )
            );


            undoMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            beta =
                Math.min(
                    beta,
                    value
                );


            if (
                beta <= alpha
            ) {

                break;
            }
        }


        return value;
    }
}


/* =========================================================
   AIの手
========================================================= */

function aiChooseMove() {

    const moves =
        legalMoves("A");


    if (
        moves.length === 0
    ) {

        return null;
    }


    /* 即勝ち */

    for (
        const move
        of moves
    ) {

        doMove(
            move.r,
            move.c,
            move.color,
            move.size
        );


        const won =
            hasOtrio(
                move.color
            );


        undoMove(
            move.r,
            move.c,
            move.color,
            move.size
        );


        if (
            won
        ) {

            return move;
        }
    }


    const depth =
        Number(
            strengthElement.value
        );


    let bestValue =
        -Infinity;

    let bestMoves = [];


    for (
        const move
        of moves
    ) {

        doMove(
            move.r,
            move.c,
            move.color,
            move.size
        );


        const value =
            minimax(

                depth - 1,

                -Infinity,

                Infinity,

                false,

                moveCount + 1
            );


        undoMove(
            move.r,
            move.c,
            move.color,
            move.size
        );


        if (
            value > bestValue
        ) {

            bestValue =
                value;

            bestMoves =
                [move];

        } else if (
            value === bestValue
        ) {

            bestMoves.push(
                move
            );
        }
    }


    return bestMoves[
        Math.floor(
            Math.random()
            *
            bestMoves.length
        )
    ];
}


/* =========================================================
   シャッフル
========================================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random()
                *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] = [

            array[j],
            array[i]
        ];
    }
}


/* =========================================================
   ターン表示
========================================================= */

function updateTurnDisplay() {

    if (
        gameOver
    ) {

        return;
    }


    const player =
        currentPlayer();

    const color =
        currentColor();


    if (
        player === "H"
    ) {

        turnInfo.textContent =
            `あなたの番：${COLOR_NAMES[color]}`;

        turnInfo.style.color =
            color === "red"
                ? "#e53935"
                : "#8e44ad";

        paletteTitle.textContent =
            `${COLOR_NAMES[color]}の駒を選んでください`;

    } else {

        turnInfo.textContent =
            `AIの番：${COLOR_NAMES[color]}`;

        turnInfo.style.color =
            color === "blue"
                ? "#1e88e5"
                : "#43a047";

        paletteTitle.textContent =
            "AIが考えています…";
    }
}


/* =========================================================
   画面描画
========================================================= */

function render() {

    boardElement.innerHTML = "";


    /* 盤 */

    for (
        let r = 0;
        r < 3;
        r++
    ) {

        for (
            let c = 0;
            c < 3;
            c++
        ) {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "cell";


            cell.dataset.r =
                r;

            cell.dataset.c =
                c;


            cell.addEventListener(
                "click",
                () =>
                    placeSelected(
                        r,
                        c
                    )
            );


            const pieces =

                [...board[r][c]]
                .sort(

                    (a,b) =>
                        sizeValue(
                            a.size
                        )
                        -
                        sizeValue(
                            b.size
                        )
                );


            for (
                const piece
                of pieces
            ) {

                const element =
                    document.createElement(
                        "div"
                    );


                /*
                 * 基本は黒。
                 * 最新の手と一致する駒だけ
                 * 本来の色にする。
                 */

                element.className =
                    `piece ${piece.size} ${piece.color}`;


                if (
                    lastMove &&
                    lastMove.r === r &&
                    lastMove.c === c &&
                    lastMove.color === piece.color &&
                    lastMove.size === piece.size
                ) {

                    element.classList.add(
                        "latest"
                    );
                }


                cell.appendChild(
                    element
                );
            }


            boardElement.appendChild(
                cell
            );
        }
    }


    renderPalette();

    updateTurnDisplay();
}


/* =========================================================
   サイズ
========================================================= */

function sizeValue(size) {

    return {

        S: 1,

        M: 2,

        L: 3

    }[size];
}


/* =========================================================
   手元の駒
========================================================= */

function renderPalette() {

    paletteElement.innerHTML = "";


    if (
        currentPlayer() !== "H"
    ) {

        return;
    }


    const color =
        currentColor();


    /*
     * 現在の色をCSS変数として設定。
     * 選択枠も赤・紫に変わる。
     */

    paletteElement.style.setProperty(
        "--current-color",
        color === "red"
            ? "#e53935"
            : "#8e44ad"
    );


    for (
        const size
        of SIZES
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            `piece-button ${size}`;


        if (
            remaining[color][size]
            <= 0
        ) {

            button.classList.add(
                "disabled"
            );
        }


        if (
            selectedSize === size
        ) {

            button.classList.add(
                "selected"
            );
        }


        const ring =
            document.createElement(
                "div"
            );


        /*
         * 現在の手番の色をそのまま使用。
         * 赤の番なら赤、紫の番なら紫。
         */

        ring.className =
            `ring ${color}`;


        const text =
            document.createElement(
                "div"
            );


        text.textContent =
            `${size}　残り ${remaining[color][size]}`;


        button.appendChild(
            ring
        );


        button.appendChild(
            text
        );


        button.addEventListener(
            "click",
            () => {

                if (
                    remaining[color][size]
                    <= 0
                ) {

                    return;
                }


                selectedSize =

                    selectedSize === size

                        ? null

                        : size;


                if (
                    selectedSize
                ) {

                    statusElement.textContent =

                        `${COLOR_NAMES[color]}の${size}を選択中。盤のマスをタップしてください。`;

                } else {

                    statusElement.textContent =
                        "駒の選択を解除しました。";
                }


                renderPalette();
            }
        );


        paletteElement.appendChild(
            button
        );
    }
}


/* =========================================================
   駒を置く
========================================================= */

function placeSelected(r,c) {

    if (
        gameOver
    ) {

        return;
    }


    if (
        currentPlayer() !== "H"
    ) {

        return;
    }


    if (
        selectedSize === null
    ) {

        statusElement.textContent =
            "まずS・M・Lの駒を選んでください。";

        return;
    }


    const color =
        currentColor();


    if (
        !canPlace(
            r,
            c,
            color,
            selectedSize
        )
    ) {

        statusElement.textContent =
            "そこには置けません。同じサイズの駒がある可能性があります。";

        return;
    }


    doMove(
        r,
        c,
        color,
        selectedSize
    );


    /*
     * 今置いた駒を「最新の手」として記録
     */

    lastMove = {

        r: r,

        c: c,

        color: color,

        size: selectedSize
    };


    selectedSize = null;

    moveCount++;


    /* 勝敗 */

    const win =
        winner();


    if (
        win
    ) {

        gameOver = true;

        render();


        turnInfo.textContent =
            `${COLOR_NAMES[win.color]}のOtrio！`;


        statusElement.textContent =
            "あなたの勝ちです！";


        setTimeout(
            () => alert(
                `Otrio！\n${COLOR_NAMES[win.color]}の勝ちです！`
            ),
            50
        );

        return;
    }


    /* AIへ */

    statusElement.textContent =
        "AIが考えています…";

    render();


    setTimeout(
        aiTurn,
        100
    );
}


/* =========================================================
   AIターン
========================================================= */

function aiTurn() {

    if (
        gameOver
    ) {

        return;
    }


    if (
        currentPlayer() !== "A"
    ) {

        return;
    }


    const aiColor =
        currentColor();


    statusElement.textContent =
        `AIの番：${COLOR_NAMES[aiColor]}。考えています…`;

    render();


    setTimeout(
        () => {

            const move =
                aiChooseMove();


            /*
             * 現在のAI色に合法手がない場合
             */

            if (
                !move
            ) {

                moveCount++;


                if (
                    legalMoves(
                        "H"
                    ).length === 0
                ) {

                    if (
                        legalMoves(
                            "A"
                        ).length === 0
                    ) {

                        gameOver = true;

                        statusElement.textContent =
                            "どちらも置ける駒がないため引き分けです。";

                        render();

                        alert(
                            "引き分けです。"
                        );

                        return;
                    }
                }


                const nextColor =
                    currentColor();


                statusElement.textContent =
                    `AIは${COLOR_NAMES[aiColor]}をパスしました。あなたの番：${COLOR_NAMES[nextColor]}`;

                render();

                return;
            }


            doMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            /*
             * AIが今置いた駒を
             * 最新の手として記録
             */

            lastMove = {

                r: move.r,

                c: move.c,

                color: move.color,

                size: move.size
            };


            moveCount++;


            /* AIの勝利 */

            const win =
                winner();


            if (
                win
            ) {

                gameOver = true;

                render();


                turnInfo.textContent =
                    `${COLOR_NAMES[win.color]}のOtrio！`;


                statusElement.textContent =
                    "AIの勝ちです。";


                setTimeout(
                    () => alert(
                        `Otrio！\nAIの勝ちです！`
                    ),
                    50
                );

                return;
            }


            /*
             * 次の人間色に
             * 合法手があるか
             */

            const humanMoves =
                legalMoves("H");


            if (
                humanMoves.length === 0
            ) {

                const skippedColor =
                    currentColor();


                moveCount++;


                if (
                    legalMoves(
                        "A"
                    ).length === 0
                ) {

                    gameOver = true;

                    statusElement.textContent =
                        "どちらも置ける駒がないため引き分けです。";

                    render();

                    alert(
                        "引き分けです。"
                    );

                    return;
                }


                const nextAIColor =
                    currentColor();


                statusElement.textContent =
                    `あなたは${COLOR_NAMES[skippedColor]}をパス。AIの番：${COLOR_NAMES[nextAIColor]}`;

                render();


                setTimeout(
                    aiTurn,
                    300
                );

                return;
            }


            const nextColor =
                currentColor();


            statusElement.textContent =
                `あなたの番：${COLOR_NAMES[nextColor]}の駒を選んでください`;

            render();

        },
        100
    );
}
