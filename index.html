<script>

/* =========================================================
   基本設定
========================================================= */

const SIZES = ["S", "M", "L"];

const HUMAN_COLORS = ["red", "purple"];

const AI_COLORS = ["blue", "green"];

const ALL_COLORS = [
    "red",
    "purple",
    "blue",
    "green"
];

const COLOR_NAMES = {
    red: "赤",
    purple: "紫",
    blue: "青",
    green: "緑"
};


/* =========================================================
   勝利ライン
========================================================= */

const LINES = [

    [[0,0],[0,1],[0,2]],
    [[1,0],[1,1],[1,2]],
    [[2,0],[2,1],[2,2]],

    [[0,0],[1,0],[2,0]],
    [[0,1],[1,1],[2,1]],
    [[0,2],[1,2],[2,2]],

    [[0,0],[1,1],[2,2]],
    [[0,2],[1,1],[2,0]]

];


/* =========================================================
   ゲーム状態
========================================================= */

let board;

let remaining;

let moveCount;

let selectedSize = null;

let gameOver = false;

let aiThinking = false;


/* =========================================================
   HTML
========================================================= */

const boardElement =
    document.getElementById("board");

const paletteElement =
    document.getElementById("palette");

const paletteTitle =
    document.getElementById("palette-title");

const statusElement =
    document.getElementById("status");

const turnInfo =
    document.getElementById("turn-info");

const orderInfo =
    document.getElementById("order-info");

const strengthElement =
    document.getElementById("strength");


/* =========================================================
   プレイヤー
========================================================= */

function currentPlayer() {

    return moveCount % 2 === 0
        ? "H"
        : "A";

}


/* =========================================================
   現在の色

   H:
   赤 → 紫 → 赤 → 紫

   A:
   青 → 緑 → 青 → 緑

   重要：
   moveCountから計算することで、
   パスしても色順が正しく進む。
========================================================= */

function currentColor(ply = moveCount) {

    const player =
        ply % 2 === 0
            ? "H"
            : "A";

    const index =
        Math.floor(ply / 2) % 2;

    if (player === "H") {

        return HUMAN_COLORS[index];

    }

    return AI_COLORS[index];

}


/* =========================================================
   色 → プレイヤー
========================================================= */

function playerOfColor(color) {

    return HUMAN_COLORS.includes(color)
        ? "H"
        : "A";

}


/* =========================================================
   新しいゲーム
========================================================= */

function newGame() {

    board =
        Array.from(
            { length: 3 },
            () =>
                Array.from(
                    { length: 3 },
                    () => []
                )
        );


    remaining = {};


    for (
        const color
        of ALL_COLORS
    ) {

        remaining[color] = {

            S: 3,
            M: 3,
            L: 3

        };

    }


    moveCount = 0;

    selectedSize = null;

    gameOver = false;

    aiThinking = false;


    statusElement.textContent =
        "ゲーム開始";


    render();

}


/* =========================================================
   駒を置けるか
========================================================= */

function canPlace(
    r,
    c,
    color,
    size
) {

    if (
        remaining[color][size] <= 0
    ) {

        return false;

    }


    /*
       同じサイズは同じマスに置けない。
    */

    for (
        const piece
        of board[r][c]
    ) {

        if (
            piece.size === size
        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   駒を置く
========================================================= */

function doMove(
    r,
    c,
    color,
    size
) {

    board[r][c].push({

        color: color,

        size: size

    });

    remaining[color][size]--;

}


/* =========================================================
   駒を戻す
========================================================= */

function undoMove(
    r,
    c,
    color,
    size
) {

    const pieces =
        board[r][c];

    const index =
        pieces.findIndex(
            piece =>
                piece.color === color &&
                piece.size === size
        );

    if (index !== -1) {

        pieces.splice(index, 1);

    }

    remaining[color][size]++;

}


/* =========================================================
   駒確認
========================================================= */

function hasPiece(
    r,
    c,
    color,
    size
) {

    return board[r][c].some(

        piece =>

            piece.color === color &&

            (
                size === undefined ||
                piece.size === size
            )

    );

}


/* =========================================================
   Otrio判定
========================================================= */

function hasOtrio(color) {


    /* -----------------------------------------
       ① 同じマスにS・M・L
    ----------------------------------------- */

    for (let r = 0; r < 3; r++) {

        for (let c = 0; c < 3; c++) {

            const sizes =
                new Set();


            for (
                const piece
                of board[r][c]
            ) {

                if (
                    piece.color === color
                ) {

                    sizes.add(
                        piece.size
                    );

                }

            }


            if (

                sizes.has("S") &&
                sizes.has("M") &&
                sizes.has("L")

            ) {

                return true;

            }

        }

    }


    /* -----------------------------------------
       ② 3マスのライン
    ----------------------------------------- */

    for (
        const line
        of LINES
    ) {


        /* 同じサイズ3個 */

        for (
            const size
            of SIZES
        ) {

            if (

                line.every(
                    ([r,c]) =>
                        hasPiece(
                            r,
                            c,
                            color,
                            size
                        )
                )

            ) {

                return true;

            }

        }


        /* S-M-L */

        if (

            hasPiece(
                ...line[0],
                color,
                "S"
            )

            &&

            hasPiece(
                ...line[1],
                color,
                "M"
            )

            &&

            hasPiece(
                ...line[2],
                color,
                "L"
            )

        ) {

            return true;

        }


        /* L-M-S */

        if (

            hasPiece(
                ...line[0],
                color,
                "L"
            )

            &&

            hasPiece(
                ...line[1],
                color,
                "M"
            )

            &&

            hasPiece(
                ...line[2],
                color,
                "S"
            )

        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   勝者
========================================================= */

function winner() {

    for (
        const color
        of ALL_COLORS
    ) {

        if (
            hasOtrio(color)
        ) {

            return {

                player:
                    playerOfColor(color),

                color:
                    color

            };

        }

    }


    return null;

}


/* =========================================================
   合法手
=========================================================

   plyを使うことで、
   Minimax内部でも

   赤 → 青 → 紫 → 緑 → 赤 → 青...

   を正しく再現する。
========================================================= */

function legalMoves(
    player,
    ply = moveCount
) {

    const colors =
        player === "H"
            ? HUMAN_COLORS
            : AI_COLORS;


    const index =
        Math.floor(ply / 2) % 2;


    const color =
        colors[index];


    const moves = [];


    for (let r = 0; r < 3; r++) {

        for (let c = 0; c < 3; c++) {

            for (
                const size
                of SIZES
            ) {

                if (
                    canPlace(
                        r,
                        c,
                        color,
                        size
                    )
                ) {

                    moves.push({

                        r: r,

                        c: c,

                        color: color,

                        size: size

                    });

                }

            }

        }

    }


    return moves;

}


/* =========================================================
   即勝利判定
========================================================= */

function moveWins(move) {

    doMove(
        move.r,
        move.c,
        move.color,
        move.size
    );


    const result =
        hasOtrio(
            move.color
        );


    undoMove(
        move.r,
        move.c,
        move.color,
        move.size
    );


    return result;

}


/* =========================================================
   評価関数
========================================================= */

function evaluate() {

    const win =
        winner();


    if (win) {

        return win.player === "A"
            ? 1000000
            : -1000000;

    }


    let score = 0;


    /* -----------------------------------------
       中央・角
    ----------------------------------------- */

    const positionValue = {

        "1,1": 12,

        "0,0": 5,
        "0,2": 5,
        "2,0": 5,
        "2,2": 5

    };


    for (
        const key
        in positionValue
    ) {

        const [r,c] =
            key
                .split(",")
                .map(Number);


        for (
            const piece
            of board[r][c]
        ) {

            const sign =
                playerOfColor(
                    piece.color
                ) === "A"
                    ? 1
                    : -1;


            score +=
                sign *
                positionValue[key];

        }

    }


    /* -----------------------------------------
       各色の脅威を評価
    ----------------------------------------- */

    for (
        const color
        of ALL_COLORS
    ) {

        const sign =
            playerOfColor(color) === "A"
                ? 1
                : -1;


        for (
            const line
            of LINES
        ) {


            /* -----------------------------
               同じサイズ
            ----------------------------- */

            for (
                const size
                of SIZES
            ) {

                let count = 0;

                for (
                    const [r,c]
                    of line
                ) {

                    if (
                        hasPiece(
                            r,
                            c,
                            color,
                            size
                        )
                    ) {

                        count++;

                    }

                }


                if (count === 2) {

                    score +=
                        sign * 250;

                }

                else if (count === 1) {

                    score +=
                        sign * 18;

                }

            }


            /* -----------------------------
               S-M-L / L-M-S
            ----------------------------- */

            const orders = [

                ["S","M","L"],

                ["L","M","S"]

            ];


            for (
                const order
                of orders
            ) {

                let count = 0;


                for (
                    let i = 0;
                    i < 3;
                    i++
                ) {

                    const [r,c] =
                        line[i];


                    if (
                        hasPiece(
                            r,
                            c,
                            color,
                            order[i]
                        )
                    ) {

                        count++;

                    }

                }


                if (count === 2) {

                    score +=
                        sign * 300;

                }

                else if (count === 1) {

                    score +=
                        sign * 25;

                }

            }

        }


        /* -----------------------------------------
           同じマスに2サイズ
        ----------------------------------------- */

        for (let r = 0; r < 3; r++) {

            for (let c = 0; c < 3; c++) {

                let count = 0;


                for (
                    const size
                    of SIZES
                ) {

                    if (
                        hasPiece(
                            r,
                            c,
                            color,
                            size
                        )
                    ) {

                        count++;

                    }

                }


                if (count === 2) {

                    score +=
                        sign * 350;

                }

                else if (count === 1) {

                    score +=
                        sign * 15;

                }

            }

        }


        /* -----------------------------------------
           残り駒が少ない場合の価値
        ----------------------------------------- */

        for (
            const size
            of SIZES
        ) {

            const left =
                remaining[color][size];


            score +=
                sign *
                (3 - left) *
                3;

        }

    }


    return score;

}


/* =========================================================
   盤面のコピー用ハッシュ
========================================================= */

function boardHash() {

    let text = "";

    for (let r = 0; r < 3; r++) {

        for (let c = 0; c < 3; c++) {

            const pieces =
                [...board[r][c]]
                    .sort(
                        (a,b) =>
                            sizeValue(a.size) -
                            sizeValue(b.size)
                    );


            for (
                const piece
                of pieces
            ) {

                text +=
                    piece.color +
                    piece.size;

            }

            text += "/";

        }

    }


    return text;

}


/* =========================================================
   Minimax

   ★重要

   置けない場合は「探索終了」ではなく
   正式にパスして次のターンへ進む。

   これが以前のコードとの重要な違い。
========================================================= */

function minimax(
    depth,
    alpha,
    beta,
    maximizing,
    ply
) {


    const win =
        winner();


    if (win) {

        return win.player === "A"

            ? 1000000 + depth * 100

            : -1000000 - depth * 100;

    }


    if (depth <= 0) {

        return evaluate();

    }


    const player =
        maximizing
            ? "A"
            : "H";


    const moves =
        legalMoves(
            player,
            ply
        );


    /* -----------------------------------------
       現在の色が置けない → パス
    ----------------------------------------- */

    if (
        moves.length === 0
    ) {

        const nextPlayer =
            player === "A"
                ? "H"
                : "A";


        const nextMoves =
            legalMoves(
                nextPlayer,
                ply + 1
            );


        /* 両方とも置けないなら引き分け */

        if (
            nextMoves.length === 0
        ) {

            return 0;

        }


        /*
           パスして次のプレイヤーへ。
        */

        return minimax(
            depth - 1,
            alpha,
            beta,
            !maximizing,
            ply + 1
        );

    }


    shuffle(moves);


    /* =====================================================
       AI側
    ===================================================== */

    if (maximizing) {

        let value =
            -Infinity;


        for (
            const move
            of moves
        ) {

            doMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            const childValue =
                minimax(
                    depth - 1,
                    alpha,
                    beta,
                    false,
                    ply + 1
                );


            undoMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            value =
                Math.max(
                    value,
                    childValue
                );


            alpha =
                Math.max(
                    alpha,
                    value
                );


            if (
                beta <= alpha
            ) {

                break;

            }

        }


        return value;

    }


    /* =====================================================
       人間側
    ===================================================== */

    else {

        let value =
            Infinity;


        for (
            const move
            of moves
        ) {

            doMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            const childValue =
                minimax(
                    depth - 1,
                    alpha,
                    beta,
                    true,
                    ply + 1
                );


            undoMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            value =
                Math.min(
                    value,
                    childValue
                );


            beta =
                Math.min(
                    beta,
                    value
                );


            if (
                beta <= alpha
            ) {

                break;

            }

        }


        return value;

    }

}


/* =========================================================
   AIの手

   優先順位

   ① 即勝ち
   ② 相手の即勝ちを防ぐ
   ③ Minimax
========================================================= */

function aiChooseMove() {

    const moves =
        legalMoves("A");


    if (
        moves.length === 0
    ) {

        return null;

    }


    /* -----------------------------------------
       ① AI自身の即勝ち
    ----------------------------------------- */

    for (
        const move
        of moves
    ) {

        if (
            moveWins(move)
        ) {

            return move;

        }

    }


    /* -----------------------------------------
       ② 人間の次の即勝ちを防ぐ

       AIが今どこにも置かない場合、
       人間が次に勝てる手があるか調べる。

       それを防げるAI手を優先する。
    ----------------------------------------- */

    const opponentPly =
        moveCount + 1;


    const humanMoves =
        legalMoves(
            "H",
            opponentPly
        );


    const winningHumanMoves =
        humanMoves.filter(
            move =>
                moveWins(move)
        );


    if (
        winningHumanMoves.length > 0
    ) {

        const blockingMoves = [];


        for (
            const aiMove
            of moves
        ) {

            doMove(
                aiMove.r,
                aiMove.c,
                aiMove.color,
                aiMove.size
            );


            let stillWinning = false;


            for (
                const humanMove
                of legalMoves(
                    "H",
                    opponentPly
                )
            ) {

                if (
                    moveWins(humanMove)
                ) {

                    stillWinning = true;

                    break;

                }

            }


            undoMove(
                aiMove.r,
                aiMove.c,
                aiMove.color,
                aiMove.size
            );


            if (!stillWinning) {

                blockingMoves.push(
                    aiMove
                );

            }

        }


        if (
            blockingMoves.length > 0
        ) {

            /*
               防御可能な手だけに絞る。
            */

            return chooseByMinimax(
                blockingMoves
            );

        }

    }


    /* -----------------------------------------
       ③ 通常のMinimax
    ----------------------------------------- */

    return chooseByMinimax(
        moves
    );

}


/* =========================================================
   Minimaxによる最善手選択
========================================================= */

function chooseByMinimax(moves) {

    const strength =
        Number(
            strengthElement.value
        );


    /*
       強さ

       普通  → 2
       強い  → 4
       最強  → 5

       以前より「強い」と「最強」の差を
       分かりやすくする。
    */

    let depth;

    if (strength === 2) {

        depth = 2;

    }

    else if (strength === 3) {

        depth = 4;

    }

    else {

        depth = 5;

    }


    let bestValue =
        -Infinity;

    let bestMoves = [];


    for (
        const move
        of moves
    ) {

        doMove(
            move.r,
            move.c,
            move.color,
            move.size
        );


        const value =
            minimax(
                depth - 1,
                -Infinity,
                Infinity,
                false,
                moveCount + 1
            );


        undoMove(
            move.r,
            move.c,
            move.color,
            move.size
        );


        if (
            value > bestValue
        ) {

            bestValue =
                value;

            bestMoves =
                [move];

        }

        else if (
            value === bestValue
        ) {

            bestMoves.push(
                move
            );

        }

    }


    if (
        bestMoves.length === 0
    ) {

        return moves[0];

    }


    return bestMoves[
        Math.floor(
            Math.random() *
            bestMoves.length
        )
    ];

}


/* =========================================================
   シャッフル
========================================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];

    }

}


/* =========================================================
   サイズ数値
========================================================= */

function sizeValue(size) {

    return {

        S: 1,

        M: 2,

        L: 3

    }[size];

}


/* =========================================================
   色順表示
========================================================= */

function updateOrderDisplay() {

    const humanColors = [

        "red",
        "purple",
        "red",
        "purple"

    ];


    const aiColors = [

        "blue",
        "green",
        "blue",
        "green"

    ];


    /*
       現在の手番を色付き表示
    */

    let humanIndex = -1;

    let aiIndex = -1;


    if (
        currentPlayer() === "H"
    ) {

        humanIndex =
            Math.floor(
                moveCount / 2
            ) % 2;

    }

    else {

        aiIndex =
            Math.floor(
                moveCount / 2
            ) % 2;

    }


    let humanHTML = "";


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const color =
            humanColors[i];


        if (
            i === humanIndex
        ) {

            humanHTML +=
                `<span class="order-${color}">` +
                COLOR_NAMES[color] +
                `</span>`;

        }

        else {

            humanHTML +=
                `<span class="color-label">` +
                COLOR_NAMES[color] +
                `</span>`;

        }


        if (i < 3) {

            humanHTML +=
                " → ";

        }

    }


    let aiHTML = "";


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const color =
            aiColors[i];


        if (
            i === aiIndex
        ) {

            aiHTML +=
                `<span class="order-${color}">` +
                COLOR_NAMES[color] +
                `</span>`;

        }

        else {

            aiHTML +=
                `<span class="color-label">` +
                COLOR_NAMES[color] +
                `</span>`;

        }


        if (i < 3) {

            aiHTML +=
                " → ";

        }

    }


    orderInfo.innerHTML =
        "あなた： " +
        humanHTML +
        "　・　AI： " +
        aiHTML;

}


/* =========================================================
   ターン表示
========================================================= */

function updateTurnDisplay() {

    if (
        gameOver
    ) {

        return;

    }


    const player =
        currentPlayer();


    const color =
        currentColor();


    if (
        player === "H"
    ) {

        turnInfo.textContent =
            `あなたの番：${COLOR_NAMES[color]}`;


        turnInfo.style.color =
            color === "red"
                ? "#e53935"
                : "#8e44ad";


        paletteTitle.textContent =
            `${COLOR_NAMES[color]}の駒を選んでください`;

    }

    else {

        turnInfo.textContent =
            `AIの番：${COLOR_NAMES[color]}`;


        turnInfo.style.color =
            color === "blue"
                ? "#1e88e5"
                : "#43a047";


        paletteTitle.textContent =
            "AIが考えています…";

    }


    updateOrderDisplay();

}


/* =========================================================
   画面描画
========================================================= */

function render() {

    boardElement.innerHTML = "";


    for (let r = 0; r < 3; r++) {

        for (let c = 0; c < 3; c++) {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "cell";


            cell.dataset.r = r;

            cell.dataset.c = c;


            cell.addEventListener(
                "click",
                () =>
                    placeSelected(
                        r,
                        c
                    )
            );


            /*
               大 → 中 → 小の順で描画。
               CSSのサイズによって、
               小さい駒が上に見える。
            */

            const pieces =
                [...board[r][c]]
                    .sort(
                        (a,b) =>
                            sizeValue(b.size) -
                            sizeValue(a.size)
                    );


            for (
                const piece
                of pieces
            ) {

                const element =
                    document.createElement(
                        "div"
                    );


                /*
                   ★色はpiece.colorを
                   そのまま使用。

                   赤 → red
                   紫 → purple
                   青 → blue
                   緑 → green
                */

                element.className =
                    `piece ${piece.size} ${piece.color}`;


                cell.appendChild(
                    element
                );

            }


            boardElement.appendChild(
                cell
            );

        }

    }


    renderPalette();

    updateTurnDisplay();

}


/* =========================================================
   手元の駒
========================================================= */

function renderPalette() {

    paletteElement.innerHTML = "";


    if (
        currentPlayer() !== "H"
    ) {

        return;

    }


    const color =
        currentColor();


    for (
        const size
        of SIZES
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            `piece-button ${size}`;


        if (
            remaining[color][size] <= 0
        ) {

            button.classList.add(
                "disabled"
            );

        }


        if (
            selectedSize === size
        ) {

            button.classList.add(
                "selected"
            );

        }


        const ring =
            document.createElement(
                "div"
            );


        /*
           ★盤面と同じcolorを使用
        */

        ring.className =
            `ring ${color}`;


        const text =
            document.createElement(
                "div"
            );


        text.textContent =
            `${size}　残り ${remaining[color][size]}`;


        button.appendChild(
            ring
        );


        button.appendChild(
            text
        );


        button.addEventListener(
            "click",
            () => {

                if (
                    remaining[color][size] <= 0
                ) {

                    return;

                }


                selectedSize =
                    selectedSize === size
                        ? null
                        : size;


                if (
                    selectedSize
                ) {

                    statusElement.textContent =
                        `${COLOR_NAMES[color]}の${size}を選択中。盤のマスをタップしてください。`;

                }

                else {

                    statusElement.textContent =
                        "駒の選択を解除しました。";

                }


                renderPalette();

            }
        );


        paletteElement.appendChild(
            button
        );

    }

}


/* =========================================================
   人間の手
========================================================= */

function placeSelected(r,c) {

    if (
        gameOver ||
        aiThinking
    ) {

        return;

    }


    if (
        currentPlayer() !== "H"
    ) {

        return;

    }


    if (
        selectedSize === null
    ) {

        statusElement.textContent =
            "まずS・M・Lの駒を選んでください。";

        return;

    }


    const color =
        currentColor();


    if (
        !canPlace(
            r,
            c,
            color,
            selectedSize
        )
    ) {

        statusElement.textContent =
            "そこには置けません。同じサイズの駒がある可能性があります。";

        return;

    }


    doMove(
        r,
        c,
        color,
        selectedSize
    );


    selectedSize = null;


    moveCount++;


    const win =
        winner();


    if (win) {

        finishGame(
            win,
            true
        );

        return;

    }


    statusElement.textContent =
        "AIが考えています…";


    render();


    aiThinking = true;


    setTimeout(
        aiTurn,
        100
    );

}


/* =========================================================
   AIターン
========================================================= */

function aiTurn() {

    if (
        gameOver
    ) {

        return;

    }


    if (
        currentPlayer() !== "A"
    ) {

        aiThinking = false;

        return;

    }


    const aiColor =
        currentColor();


    statusElement.textContent =
        `AIの番：${COLOR_NAMES[aiColor]}。考えています…`;


    render();


    /*
       少し待ってから思考開始。
       「AIが考えている」ことが
       画面上でも分かるようにする。
    */

    setTimeout(
        () => {

            const move =
                aiChooseMove();


            /* -------------------------------------
               AIが置けない → パス
            ------------------------------------- */

            if (
                !move
            ) {

                moveCount++;


                /*
                   次の人間ターンも置けない場合、
                   さらにAIへパスする。
                */

                const humanMoves =
                    legalMoves(
                        "H"
                    );


                if (
                    humanMoves.length === 0
                ) {

                    const nextAIMoves =
                        legalMoves(
                            "A"
                        );


                    if (
                        nextAIMoves.length === 0
                    ) {

                        gameOver = true;

                        aiThinking = false;


                        statusElement.textContent =
                            "どちらも置ける駒がないため引き分けです。";


                        render();


                        setTimeout(
                            () =>
                                alert(
                                    "引き分けです。"
                                ),
                            50
                        );


                        return;

                    }


                    const skippedHumanColor =
                        currentColor();


                    statusElement.textContent =
                        `あなたは${COLOR_NAMES[skippedHumanColor]}をパス。AIの番です。`;


                    render();


                    setTimeout(
                        aiTurn,
                        250
                    );


                    return;

                }


                const nextColor =
                    currentColor();


                aiThinking = false;


                statusElement.textContent =
                    `AIは${COLOR_NAMES[aiColor]}をパスしました。あなたの番：${COLOR_NAMES[nextColor]}`;


                render();


                return;

            }


            /* -------------------------------------
               AIが実際に置く
            ------------------------------------- */

            doMove(
                move.r,
                move.c,
                move.color,
                move.size
            );


            moveCount++;


            const win =
                winner();


            if (win) {

                finishGame(
                    win,
                    false
                );

                return;

            }


            /*
               次の人間色が置けるか確認
            */

            const humanMoves =
                legalMoves(
                    "H"
                );


            if (
                humanMoves.length === 0
            ) {

                const skippedColor =
                    currentColor();


                moveCount++;


                /*
                   人間がパスしたあと、
                   AIにも手がなければ引き分け。
                */

                const nextAIMoves =
                    legalMoves(
                        "A"
                    );


                if (
                    nextAIMoves.length === 0
                ) {

                    gameOver = true;

                    aiThinking = false;


                    statusElement.textContent =
                        "どちらも置ける駒がないため引き分けです。";


                    render();


                    setTimeout(
                        () =>
                            alert(
                                "引き分けです。"
                            ),
                        50
                    );


                    return;

                }


                const nextAIColor =
                    currentColor();


                statusElement.textContent =
                    `あなたは${COLOR_NAMES[skippedColor]}をパス。AIの番：${COLOR_NAMES[nextAIColor]}`;


                render();


                setTimeout(
                    aiTurn,
                    250
                );


                return;

            }


            aiThinking = false;


            const nextColor =
                currentColor();


            statusElement.textContent =
                `あなたの番：${COLOR_NAMES[nextColor]}の駒を選んでください`;


            render();

        },

        100

    );

}


/* =========================================================
   ゲーム終了
========================================================= */

function finishGame(
    win,
    humanWon
) {

    gameOver = true;

    aiThinking = false;


    render();


    turnInfo.textContent =
        `${COLOR_NAMES[win.color]}のOtrio！`;


    if (
        humanWon
    ) {

        statusElement.textContent =
            "あなたの勝ちです！";

    }

    else {

        statusElement.textContent =
            "AIの勝ちです。";

    }


    setTimeout(
        () => {

            if (
                humanWon
            ) {

                alert(
                    `Otrio！\n${COLOR_NAMES[win.color]}の勝ちです！`
                );

            }

            else {

                alert(
                    `Otrio！\nAIの勝ちです！`
                );

            }

        },

        50
    );

}

);
