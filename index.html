<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="オートリオ">
<title>オートリオ AI練習</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f4f1ea;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    user-select: none;
    overflow-x: hidden;
}

#app {
    max-width: 700px;
    margin: auto;
    padding: 10px;
}

h1 {
    text-align: center;
    margin: 5px 0;
    font-size: 25px;
}

#turn-info {
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    min-height: 28px;
}

#order-info {
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 3px;
}

.order-label {
    color: #222;
}

.order-red {
    color: #e53935;
}

.order-purple {
    color: #8e44ad;
}

.order-blue {
    color: #1e88e5;
}

.order-green {
    color: #43a047;
}

#status {
    text-align: center;
    min-height: 42px;
    font-size: 14px;
    font-weight: bold;
    padding: 6px;
}

/* =========================
   盤
========================= */

#board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    width: min(94vw, 510px);
    aspect-ratio: 1 / 1;

    margin: auto;

    background: #d8b98a;
    border: 4px solid #7d5a35;

    padding: 4px;
    gap: 3px;
}

.cell {
    position: relative;

    background: #f8ecd6;
    border: 2px solid #b68b5c;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;
}

/* =========================
   盤上の駒
========================= */

.piece {
    position: absolute;

    border-radius: 50%;
    border: 6px solid;

    pointer-events: none;
}

.piece.S {
    width: 32%;
    height: 32%;
    z-index: 1;
}

.piece.M {
    width: 57%;
    height: 57%;
    z-index: 2;
}

.piece.L {
    width: 82%;
    height: 82%;
    z-index: 3;
}

/* 色 */

.piece.red,
.ring.red {
    border-color: #e53935;
}

.piece.purple,
.ring.purple {
    border-color: #8e44ad;
}

.piece.blue,
.ring.blue {
    border-color: #1e88e5;
}

.piece.green,
.ring.green {
    border-color: #43a047;
}

/* =========================
   手元
========================= */

#palette-title {
    text-align: center;
    margin-top: 12px;
    font-size: 17px;
    font-weight: bold;
}

#palette {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 8px 0 12px;
}

.piece-button {
    width: 86px;
    height: 90px;

    border: 2px solid #aaa;
    border-radius: 12px;

    background: #fffdf8;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    font-weight: bold;

    padding: 5px;

    touch-action: manipulation;
}

.piece-button .ring {
    border-radius: 50%;
    border: 7px solid;
    flex-shrink: 0;
}

.piece-button.S .ring {
    width: 27px;
    height: 27px;
}

.piece-button.M .ring {
    width: 45px;
    height: 45px;
}

.piece-button.L .ring {
    width: 62px;
    height: 62px;
}

.piece-button.disabled {
    opacity: 0.25;
}

.piece-button.selected {
    outline: 4px solid #333;
}

/* =========================
   AI情報
========================= */

#ai-info {
    text-align: center;
    margin-top: 5px;
    margin-bottom: 5px;
    font-size: 13px;
    color: #555;
}

/* =========================
   形勢・採点
========================= */

#score-info {
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    margin: 5px 0;
}

#move-score {
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    min-height: 22px;
    margin-bottom: 5px;
}

/* =========================
   操作
========================= */

#controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;

    flex-wrap: wrap;

    margin-top: 8px;
}

button,
select {
    font-size: 16px;

    padding: 9px 13px;

    border-radius: 8px;

    border: 1px solid #aaa;

    background: white;
}

#new-game {
    font-weight: bold;
}

@media (max-width: 450px) {

    #app {
        padding: 6px;
    }

    h1 {
        font-size: 22px;
    }

    #turn-info {
        font-size: 15px;
    }

    #status {
        font-size: 13px;
    }

    .piece-button {
        width: 78px;
        height: 85px;
    }
}

</style>
</head>

<body>

<div id="app">

<h1>オートリオ AI練習</h1>

<div id="turn-info"></div>

<div id="order-info"></div>

<div id="status"></div>

<div id="board"></div>

<div id="palette-title"></div>

<div id="palette"></div>

<div id="ai-info">
AI：青・緑
</div>

<div id="score-info">
あなた：0点　AI：0点
</div>

<div id="move-score">
評価：まだありません
</div>

<div id="controls">

<label>
AIの強さ

<select id="strength">
<option value="2">普通</option>
<option value="3" selected>強い</option>
<option value="4">最強</option>
</select>
</label>

<button id="new-game">
新しいゲーム
</button>

</div>

</div>

<script>

/* =========================================================
   基本設定
========================================================= */

const SIZES = ["S", "M", "L"];

const HUMAN_COLORS = ["red", "purple"];

const AI_COLORS = ["blue", "green"];

const ALL_COLORS = [
    ...HUMAN_COLORS,
    ...AI_COLORS
];

const COLOR_NAMES = {
    red: "赤",
    purple: "紫",
    blue: "青",
    green: "緑"
};


/* =========================================================
   勝利ライン
========================================================= */

const LINES = [

    [[0,0],[0,1],[0,2]],
    [[1,0],[1,1],[1,2]],
    [[2,0],[2,1],[2,2]],

    [[0,0],[1,0],[2,0]],
    [[0,1],[1,1],[2,1]],
    [[0,2],[1,2],[2,2]],

    [[0,0],[1,1],[2,2]],
    [[0,2],[1,1],[2,0]]

];


/* =========================================================
   ゲーム状態
========================================================= */

let board;

let remaining;

let moveCount;

let humanMoveCount;

let aiMoveCount;

let selectedSize = null;

let gameOver = false;


/* =========================================================
   形勢評価
========================================================= */

/*
   AI有利 → プラス
   あなた有利 → マイナス
*/

let positionScore = 0;

/*
   直前の手によって
   どれだけ形勢が動いたか
*/

let lastMoveScore = null;


/* =========================================================
   HTML
========================================================= */

const boardElement =
    document.getElementById("board");

const paletteElement =
    document.getElementById("palette");

const paletteTitle =
    document.getElementById("palette-title");

const statusElement =
    document.getElementById("status");

const turnInfo =
    document.getElementById("turn-info");

const orderInfo =
    document.getElementById("order-info");

const strengthElement =
    document.getElementById("strength");

const scoreInfo =
    document.getElementById("score-info");

const moveScoreElement =
    document.getElementById("move-score");


/* =========================================================
   色処理
========================================================= */

function getColorForPlayer(player, placedCount) {

    const colors =
        player === "H"
            ? HUMAN_COLORS
            : AI_COLORS;

    return colors[
        placedCount % colors.length
    ];

}


/* =========================================================
   現在のプレイヤー
========================================================= */

function currentPlayer() {

    return moveCount % 2 === 0
        ? "H"
        : "A";

}


/* =========================================================
   現在の色
========================================================= */

function currentColor() {

    const player =
        currentPlayer();

    if (player === "H") {

        return getColorForPlayer(
            "H",
            humanMoveCount
        );

    }

    return getColorForPlayer(
        "A",
        aiMoveCount
    );

}


/* =========================================================
   色からプレイヤー
========================================================= */

function playerOfColor(color) {

    return HUMAN_COLORS.includes(color)
        ? "H"
        : "A";

}


/* =========================================================
   新しいゲーム
========================================================= */

function newGame() {

    board =
        Array.from(
            {length: 3},
            () =>
                Array.from(
                    {length: 3},
                    () => []
                )
        );

    remaining = {};

    for (const color of ALL_COLORS) {

        remaining[color] = {
            S: 3,
            M: 3,
            L: 3
        };

    }

    moveCount = 0;

    humanMoveCount = 0;

    aiMoveCount = 0;

    selectedSize = null;

    gameOver = false;

    positionScore = 0;

    lastMoveScore = null;

    statusElement.textContent =
        "ゲーム開始。赤の駒を選んでください";

    updateScoreDisplay();

    render();

}


/* =========================================================
   駒を置けるか
========================================================= */

function canPlace(
    r,
    c,
    color,
    size
) {

    if (
        remaining[color][size] <= 0
    ) {

        return false;

    }

    for (
        const piece
        of board[r][c]
    ) {

        if (
            piece.size === size
        ) {

            return false;

        }

    }

    return true;

}


/* =========================================================
   駒を置く
========================================================= */

function doMove(
    r,
    c,
    color,
    size
) {

    board[r][c].push({

        color: color,

        size: size

    });

    remaining[color][size]--;

}


/* =========================================================
   駒を戻す
========================================================= */

function undoMove(
    r,
    c,
    color,
    size
) {

    const index =
        board[r][c].findLastIndex(
            piece =>
                piece.color === color &&
                piece.size === size
        );

    if (index !== -1) {

        board[r][c].splice(
            index,
            1
        );

    }

    remaining[color][size]++;

}


/* =========================================================
   駒の存在確認
========================================================= */

function hasPiece(
    r,
    c,
    color,
    size
) {

    return board[r][c].some(

        piece =>

            piece.color === color &&

            (
                size === undefined ||
                piece.size === size
            )

    );

}


/* =========================================================
   Otrio判定
========================================================= */

function hasOtrio(color) {

    /*
       同じマスにS・M・L
    */

    for (let r = 0; r < 3; r++) {

        for (let c = 0; c < 3; c++) {

            const sizes =
                new Set();

            for (
                const piece
                of board[r][c]
            ) {

                if (
                    piece.color === color
                ) {

                    sizes.add(
                        piece.size
                    );

                }

            }

            if (
                sizes.has("S") &&
                sizes.has("M") &&
                sizes.has("L")
            ) {

                return true;

            }

        }

    }


    /*
       3マスのライン
    */

    for (
        const line
        of LINES
    ) {

        /*
           同じサイズ3個
        */

        for (
            const size
            of SIZES
        ) {

            if (

                line.every(

                    ([r,c]) =>

                        hasPiece(
                            r,
                            c,
                            color,
                            size
                        )

                )

            ) {

                return true;

            }

        }


        /*
           S → M → L
        */

        if (

            hasPiece(
                ...line[0],
                color,
                "S"
            )

            &&

            hasPiece(
                ...line[1],
                color,
                "M"
            )

            &&

            hasPiece(
                ...line[2],
                color,
                "L"
            )

        ) {

            return true;

        }


        /*
           L → M → S
        */

        if (

            hasPiece(
                ...line[0],
                color,
                "L"
            )

            &&

            hasPiece(
                ...line[1],
                color,
                "M"
            )

            &&

            hasPiece(
                ...line[2],
                color,
                "S"
            )

        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   勝者
========================================================= */

function winner() {

    for (
        const color
        of ALL_COLORS
    ) {

        if (
            hasOtrio(color)
        ) {

            return {

                player:
                    playerOfColor(color),

                color:
                    color

            };

        }

    }

    return null;

}


/* =========================================================
   合法手
========================================================= */

function legalMoves(
    player,
    humanCount,
    aiCount
) {

    const placedCount =
        player === "H"
            ? humanCount
            : aiCount;

    const color =
        getColorForPlayer(
            player,
            placedCount
        );

    const moves = [];

    for (let r = 0; r < 3; r++) {

        for (let c = 0; c < 3; c++) {

            for (
                const size
                of SIZES
            ) {

                if (
                    canPlace(
                        r,
                        c,
                        color,
                        size
                    )
                ) {

                    moves.push({

                        r,
                        c,
                        color,
                        size

                    });

                }

            }

        }

    }

    return moves;

}


/* =========================================================
   AI評価関数
========================================================= */

function evaluate() {

    const win =
        winner();

    if (win) {

        return win.player === "A"
            ? 100000
            : -100000;

    }

    let score = 0;


    /*
       中央・角
    */

    const positions = {

        "1,1": 8,

        "0,0": 4,
        "0,2": 4,
        "2,0": 4,
        "2,2": 4

    };


    for (
        const key
        in positions
    ) {

        const [r,c] =
            key
                .split(",")
                .map(Number);

        for (
            const piece
            of board[r][c]
        ) {

            const value =
                positions[key];

            score +=

                playerOfColor(
                    piece.color
                ) === "A"

                    ? value

                    : -value;

        }

    }


    /*
       色ごとのライン評価
    */

    for (
        const color
        of ALL_COLORS
    ) {

        const sign =
            playerOfColor(color) === "A"
                ? 1
                : -1;


        for (
            const line
            of LINES
        ) {

            /*
               同サイズ
            */

            for (
                const size
                of SIZES
            ) {

                const count =
                    line.filter(

                        ([r,c]) =>

                            hasPiece(
                                r,
                                c,
                                color,
                                size
                            )

                    ).length;


                if (
                    count === 2
                ) {

                    score +=
                        sign * 90;

                }

                if (
                    count === 1
                ) {

                    score +=
                        sign * 12;

                }

            }


            /*
               S-M-L / L-M-S
            */

            for (
                const order
                of [
                    ["S","M","L"],
                    ["L","M","S"]
                ]
            ) {

                let count = 0;

                for (
                    let i = 0;
                    i < 3;
                    i++
                ) {

                    const [r,c] =
                        line[i];

                    if (
                        hasPiece(
                            r,
                            c,
                            color,
                            order[i]
                        )
                    ) {

                        count++;

                    }

                }

                if (
                    count === 2
                ) {

                    score +=
                        sign * 120;

                }

                if (
                    count === 1
                ) {

                    score +=
                        sign * 15;

                }

            }

        }


        /*
           同じマスに2サイズ
        */

        for (let r = 0; r < 3; r++) {

            for (let c = 0; c < 3; c++) {

                let count = 0;

                for (
                    const size
                    of SIZES
                ) {

                    if (
                        hasPiece(
                            r,
                            c,
                            color,
                            size
                        )
                    ) {

                        count++;

                    }

                }

                if (
                    count === 2
                ) {

                    score +=
                        sign * 130;

                }

                if (
                    count === 1
                ) {

                    score +=
                        sign * 10;

                }

            }

        }

    }

    return score;

}


/* =========================================================
   表示用の採点
========================================================= */

function displayScore(rawScore) {

    let score =
        Math.round(
            rawScore / 8
        );

    score =
        Math.max(
            -100,
            Math.min(
                100,
                score
            )
        );

    if (
        Math.abs(score) < 2
    ) {

        score = 0;

    }

    return score;

}


/* =========================================================
   形勢表示
========================================================= */

function updateScoreDisplay() {

    const score =
        positionScore;


    /*
       positionScore

       AI有利 → プラス
       あなた有利 → マイナス
    */

    const humanScore =
        -score;

    const aiScore =
        score;


    scoreInfo.textContent =
        `あなた：${
            humanScore >= 0
                ? "+"
                : ""
        }${humanScore}点　AI：${
            aiScore >= 0
                ? "+"
                : ""
        }${aiScore}点`;


    /*
       今回の手
    */

    if (
        lastMoveScore === null
    ) {

        moveScoreElement.textContent =
            "評価：まだありません";

        return;

    }


    if (
        lastMoveScore > 0
    ) {

        moveScoreElement.textContent =
            `今回の手：AIに +${lastMoveScore}点`;

    }

    else if (
        lastMoveScore < 0
    ) {

        moveScoreElement.textContent =
            `今回の手：あなたに +${Math.abs(lastMoveScore)}点`;

    }

    else {

        moveScoreElement.textContent =
            "今回の手：互角";

    }

}


/* =========================================================
   Minimax
========================================================= */

function minimax(

    depth,
    alpha,
    beta,
    maximizing,

    simulatedHumanCount,
    simulatedAICount

) {

    const win =
        winner();

    if (win) {

        return win.player === "A"
            ? 100000 + depth
            : -100000 - depth;

    }

    if (
        depth <= 0
    ) {

        return evaluate();

    }


    const player =
        maximizing
            ? "A"
            : "H";


    const moves =
        legalMoves(

            player,

            simulatedHumanCount,

            simulatedAICount

        );


    /*
       パス
    */

    if (
        moves.length === 0
    ) {

        const opponent =
            player === "A"
                ? "H"
                : "A";


        const opponentMoves =
            legalMoves(

                opponent,

                simulatedHumanCount,
                simulatedAICount

            );


        if (
            opponentMoves.length === 0
        ) {

            return evaluate();

        }


        return minimax(

            depth - 1,

            alpha,
            beta,

            !maximizing,

            simulatedHumanCount,
            simulatedAICount

        );

    }


    shuffle(moves);


    /*
       AI
    */

    if (maximizing) {

        let value =
            -Infinity;


        for (
            const move
            of moves
        ) {

            doMove(

                move.r,
                move.c,
                move.color,
                move.size

            );


            value =
                Math.max(

                    value,

                    minimax(

                        depth - 1,

                        alpha,
                        beta,

                        false,

                        simulatedHumanCount,

                        simulatedAICount + 1

                    )

                );


            undoMove(

                move.r,
                move.c,
                move.color,
                move.size

            );


            alpha =
                Math.max(
                    alpha,
                    value
                );


            if (
                beta <= alpha
            ) {

                break;

            }

        }


        return value;

    }


    /*
       あなた
    */

    else {

        let value =
            Infinity;


        for (
            const move
            of moves
        ) {

            doMove(

                move.r,
                move.c,
                move.color,
                move.size

            );


            value =
                Math.min(

                    value,

                    minimax(

                        depth - 1,

                        alpha,
                        beta,

                        true,

                        simulatedHumanCount + 1,

                        simulatedAICount

                    )

                );


            undoMove(

                move.r,
                move.c,
                move.color,
                move.size

            );


            beta =
                Math.min(
                    beta,
                    value
                );


            if (
                beta <= alpha
            ) {

                break;

            }

        }


        return value;

    }

}


/* =========================================================
   AIの手
========================================================= */

function aiChooseMove() {

    const moves =
        legalMoves(

            "A",

            humanMoveCount,
            aiMoveCount

        );


    if (
        moves.length === 0
    ) {

        return null;

    }


    /*
       即勝ちを最優先
    */

    for (
        const move
        of moves
    ) {

        doMove(

            move.r,
            move.c,
            move.color,
            move.size

        );


        const won =
            hasOtrio(
                move.color
            );


        undoMove(

            move.r,
            move.c,
            move.color,
            move.size

        );


        if (won) {

            return move;

        }

    }


    /*
       Minimax
    */

    const depth =
        Number(
            strengthElement.value
        );


    let bestValue =
        -Infinity;


    let bestMoves = [];


    for (
        const move
        of moves
    ) {

        doMove(

            move.r,
            move.c,
            move.color,
            move.size

        );


        const value =
            minimax(

                depth - 1,

                -Infinity,
                Infinity,

                false,

                humanMoveCount,
                aiMoveCount + 1

            );


        undoMove(

            move.r,
            move.c,
            move.color,
            move.size

        );


        if (
            value > bestValue
        ) {

            bestValue =
                value;

            bestMoves =
                [move];

        }

        else if (
            value === bestValue
        ) {

            bestMoves.push(
                move
            );

        }

    }


    return bestMoves[

        Math.floor(

            Math.random() *
            bestMoves.length

        )

    ];

}


/* =========================================================
   シャッフル
========================================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(

                Math.random() *
                (i + 1)

            );


        [
            array[i],
            array[j]

        ] = [

            array[j],
            array[i]

        ];

    }

}


/* =========================================================
   サイズ
========================================================= */

function sizeValue(size) {

    return {

        S: 1,
        M: 2,
        L: 3

    }[size];

}


/* =========================================================
   色順表示
========================================================= */

function updateOrderDisplay() {

    const humanOrder = [
        "red",
        "purple",
        "red",
        "purple"
    ];


    const aiOrder = [
        "blue",
        "green",
        "blue",
        "green"
    ];


    const humanActive =
        humanMoveCount % 4;


    const aiActive =
        aiMoveCount % 4;


    let humanHTML = "";


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const color =
            humanOrder[i];


        if (
            i === humanActive &&
            !gameOver
        ) {

            humanHTML +=
                `<span class="order-${color}">${COLOR_NAMES[color]}</span>`;

        }

        else {

            humanHTML +=
                `<span class="order-label">${COLOR_NAMES[color]}</span>`;

        }


        if (
            i < 3
        ) {

            humanHTML +=
                " → ";

        }

    }


    let aiHTML = "";


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const color =
            aiOrder[i];


        if (
            i === aiActive &&
            !gameOver
        ) {

            aiHTML +=
                `<span class="order-${color}">${COLOR_NAMES[color]}</span>`;

        }

        else {

            aiHTML +=
                `<span class="order-label">${COLOR_NAMES[color]}</span>`;

        }


        if (
            i < 3
        ) {

            aiHTML +=
                " → ";

        }

    }


    orderInfo.innerHTML =
        "あなた： " +
        humanHTML +
        "　・　AI： " +
        aiHTML;

}


/* =========================================================
   ターン表示
========================================================= */

function updateTurnDisplay() {

    if (
        gameOver
    ) {

        return;

    }


    const player =
        currentPlayer();


    const color =
        currentColor();


    if (
        player === "H"
    ) {

        turnInfo.textContent =
            `あなたの番：${COLOR_NAMES[color]}`;


        turnInfo.style.color =
            color === "red"
                ? "#e53935"
                : "#8e44ad";


        paletteTitle.textContent =
            `${COLOR_NAMES[color]}の駒を選んでください`;

    }

    else {

        turnInfo.textContent =
            `AIの番：${COLOR_NAMES[color]}`;


        turnInfo.style.color =
            color === "blue"
                ? "#1e88e5"
                : "#43a047";


        paletteTitle.textContent =
            "AIが考えています…";

    }


    updateOrderDisplay();

}


/* =========================================================
   画面描画
========================================================= */

function render() {

    boardElement.innerHTML = "";


    for (
        let r = 0;
        r < 3;
        r++
    ) {

        for (
            let c = 0;
            c < 3;
            c++
        ) {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "cell";


            cell.dataset.r = r;
            cell.dataset.c = c;


            cell.addEventListener(

                "click",

                () =>
                    placeSelected(
                        r,
                        c
                    )

            );


            /*
               小 → 中 → 大
            */

            const pieces =
                [...board[r][c]]
                .sort(

                    (a,b) =>

                        sizeValue(a.size)
                        -
                        sizeValue(b.size)

                );


            for (
                const piece
                of pieces
            ) {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    `piece ${piece.size} ${piece.color}`;


                cell.appendChild(
                    element
                );

            }


            boardElement.appendChild(
                cell
            );

        }

    }


    renderPalette();

    updateTurnDisplay();

}


/* =========================================================
   手元の駒
========================================================= */

function renderPalette() {

    paletteElement.innerHTML = "";


    if (
        currentPlayer() !== "H" ||
        gameOver
    ) {

        return;

    }


    /*
       「あなたの番」の色と
       完全に同じ色を使用
    */

    const color =
        currentColor();


    for (
        const size
        of SIZES
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            `piece-button ${size}`;


        if (
            remaining[color][size] <= 0
        ) {

            button.classList.add(
                "disabled"
            );

        }


        if (
            selectedSize === size
        ) {

            button.classList.add(
                "selected"
            );

        }


        const ring =
            document.createElement(
                "div"
            );


        /*
           ★ここで
           「あなたの番」の色と
           同じcolorを使う
        */

        ring.className =
            `ring ${color}`;
        
        /* 手元の駒の色を確実に現在の色と同じにする */
        ring.style.borderColor =
            color === "red"
                ? "#e53935"
                : color === "purple"
                    ? "#8e44ad"
                    : color === "blue"
                        ? "#1e88e5"
                        : "#43a047";


        const text =
            document.createElement(
                "div"
            );


        text.textContent =
            `${size}　残り ${remaining[color][size]}`;


        button.appendChild(
            ring
        );

        button.appendChild(
            text
        );


        button.addEventListener(

            "click",

            () => {

                if (
                    remaining[color][size] <= 0
                ) {

                    return;

                }


                selectedSize =
                    selectedSize === size
                        ? null
                        : size;


                if (
                    selectedSize
                ) {

                    statusElement.textContent =
                        `${COLOR_NAMES[color]}の${size}を選択中。盤のマスをタップしてください。`;

                }

                else {

                    statusElement.textContent =
                        "駒の選択を解除しました。";

                }


                renderPalette();

            }

        );


        paletteElement.appendChild(
            button
        );

    }

}


/* =========================================================
   あなたの手
========================================================= */

function placeSelected(r,c) {

    if (
        gameOver
    ) {

        return;

    }


    if (
        currentPlayer() !== "H"
    ) {

        return;

    }


    if (
        selectedSize === null
    ) {

        statusElement.textContent =
            "まずS・M・Lの駒を選んでください。";

        return;

    }


    /*
       駒を置く前の評価
    */

    const beforeScore =
        evaluate();


    const color =
        currentColor();


    if (
        !canPlace(
            r,
            c,
            color,
            selectedSize
        )
    ) {

        statusElement.textContent =
            "そこには置けません。同じサイズの駒がある可能性があります。";

        return;

    }


    doMove(

        r,
        c,
        color,
        selectedSize

    );


    /*
       駒を置いた後の評価
    */

    const afterScore =
        evaluate();


    const rawChange =
        afterScore - beforeScore;


    /*
       あなたの手

       AI評価が下がる
       ↓
       あなたにとって良い
    */

    lastMoveScore =
        displayScore(rawChange);


    positionScore =
        displayScore(afterScore);


    updateScoreDisplay();


    selectedSize = null;


    /*
       実際に置いたので
       人間の手数を増やす
    */

    humanMoveCount++;

    moveCount++;


    /*
       勝敗判定
    */

    const win =
        winner();


    if (
        win
    ) {

        gameOver = true;


        render();


        turnInfo.textContent =
            `${COLOR_NAMES[win.color]}のOtrio！`;


        statusElement.textContent =
            "あなたの勝ちです！";


        setTimeout(

            () =>

                alert(
                    `Otrio！\n${COLOR_NAMES[win.color]}の勝ちです！`
                ),

            50

        );


        return;

    }


    statusElement.textContent =
        "AIが考えています…";


    render();


    setTimeout(
        aiTurn,
        100
    );

}


/* =========================================================
   AIターン
========================================================= */

function aiTurn() {

    if (
        gameOver
    ) {

        return;

    }


    if (
        currentPlayer() !== "A"
    ) {

        return;

    }


    const aiColor =
        currentColor();


    statusElement.textContent =
        `AIの番：${COLOR_NAMES[aiColor]}。考えています…`;


    render();


    setTimeout(

        () => {

            const move =
                aiChooseMove();


            /*
               AIが置けない
            */

            if (
                !move
            ) {

                moveCount++;


                const humanMoves =
                    legalMoves(
                        "H",
                        humanMoveCount,
                        aiMoveCount
                    );


                if (
                    humanMoves.length === 0
                ) {

                    const aiMoves =
                        legalMoves(
                            "A",
                            humanMoveCount,
                            aiMoveCount
                        );


                    if (
                        aiMoves.length === 0
                    ) {

                        gameOver = true;


                        statusElement.textContent =
                            "どちらも置ける駒がないため引き分けです。";


                        render();


                        setTimeout(

                            () =>
                                alert(
                                    "引き分けです。"
                                ),

                            50

                        );


                        return;

                    }

                }


                const nextColor =
                    currentColor();


                statusElement.textContent =
                    `AIは${COLOR_NAMES[aiColor]}をパスしました。あなたの番：${COLOR_NAMES[nextColor]}`;


                render();


                return;

            }


            /*
               AIの手を置く前の評価
            */

            const beforeScore =
                evaluate();


            /*
               AIが実際に置く
            */

            doMove(

                move.r,
                move.c,
                move.color,
                move.size

            );


            /*
               AIの手を置いた後の評価
            */

            const afterScore =
                evaluate();


            const rawChange =
                afterScore - beforeScore;


            /*
               AIの手

               評価が上がる
               ↓
               AIにとって良い
            */

            lastMoveScore =
                displayScore(rawChange);


            positionScore =
                displayScore(afterScore);


            updateScoreDisplay();


            /*
               AIの実際の手数だけ増やす
            */

            aiMoveCount++;

            moveCount++;


            /*
               勝敗判定
            */

            const win =
                winner();


            if (
                win
            ) {

                gameOver = true;


                render();


                turnInfo.textContent =
                    `${COLOR_NAMES[win.color]}のOtrio！`;


                statusElement.textContent =
                    "AIの勝ちです。";


                setTimeout(

                    () =>

                        alert(
                            `Otrio！\nAIの勝ちです！`
                        ),

                    50

                );


                return;

            }


            /*
               あなたが置けるか確認
            */

            const humanMoves =
                legalMoves(

                    "H",

                    humanMoveCount,
                    aiMoveCount

                );


            /*
               あなたも置けない
            */

            if (
                humanMoves.length === 0
            ) {

                const skippedColor =
                    currentColor();


                /*
                   あなたはパス
                */

                moveCount++;


                /*
                   AIも置けないなら引き分け
                */

                const nextAIMoves =
                    legalMoves(

                        "A",

                        humanMoveCount,
                        aiMoveCount

                    );


                if (
                    nextAIMoves.length === 0
                ) {

                    gameOver = true;


                    statusElement.textContent =
                        "どちらも置ける駒がないため引き分けです。";


                    render();


                    setTimeout(

                        () =>
                            alert(
                                "引き分けです。"
                            ),

                        50

                    );


                    return;

                }


                const nextAIColor =
                    currentColor();


                statusElement.textContent =
                    `あなたは${COLOR_NAMES[skippedColor]}をパス。AIの番：${COLOR_NAMES[nextAIColor]}`;


                render();


                setTimeout(
                    aiTurn,
                    300
                );


                return;

            }


            /*
               通常のあなたのターン
            */

            const nextColor =
                currentColor();


            statusElement.textContent =
                `あなたの番：${COLOR_NAMES[nextColor]}の駒を選んでください`;


            render();

        },

        100

    );

}
